<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>@doctors.speak — Academic & Clinical Vocabulary Trainer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --kz-blue: #00A1DE;
      --kz-blue-dark: #0077A3;
      --kz-blue-light: #EBF8FC;
      --kz-gold: #FFC72C;
      --bg-main: #F2F5F8;
      --card-bg: #FFFFFF;
      --text-dark: #1E293B;
      --text-muted: #64748B;
      --border-color: #E2E8F0;
      --correct-bg: #E6F4EA;
      --correct-border: #34A853;
      --correct-text: #137333;
      --wrong-bg: #FCE8E6;
      --wrong-border: #EA4335;
      --wrong-text: #C5221F;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-main);
      color: var(--text-dark);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    /* Главный контейнер карточки */
    .card {
      position: relative;
      background: var(--card-bg);
      border-radius: 28px;
      width: 100%;
      max-width: 420px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }

    /* Яркая голубая шапка */
    .header {
      background: var(--kz-blue);
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .home-btn {
      background: rgba(255, 255, 255, 0.25);
      color: #FFFFFF;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 8px 16px;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      transition: background 0.2s ease;
    }

    .home-btn:active {
      background: rgba(255, 255, 255, 0.4);
    }

    .brand {
      background: rgba(255, 255, 255, 0.25);
      color: #FFFFFF;
      font-weight: 800;
      font-size: 0.8rem;
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      letter-spacing: 0.5px;
    }

    /* Содержимое карточки */
    .content {
      padding: 18px 20px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Выбор режима */
    .mode-select {
      width: 100%;
      padding: 9px 14px;
      border: 1px solid #D0E4EC;
      border-radius: 12px;
      font-weight: 700;
      color: var(--kz-blue-dark);
      background: var(--kz-blue-light);
      outline: none;
      font-size: 0.82rem;
      cursor: pointer;
      text-align: center;
    }

    /* Статистика */
    .stats-bar {
      background: #F8FAFC;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-dark);
    }

    .stat-val {
      font-weight: 800;
    }

    .stat-val.correct {
      color: #22C55E;
    }

    .stat-val.streak {
      color: #F59E0B;
    }

    /* Блок вопроса с желтой полоской слева */
    .term-box {
      position: relative;
      border: 1px solid #E2E8F0;
      border-radius: 20px;
      padding: 24px 18px;
      text-align: center;
      min-height: 150px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #FFFFFF;
      overflow: hidden;
    }

    .term-box::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 6px;
      background: var(--kz-gold);
    }

    .level-badge {
      display: inline-block;
      background: var(--kz-blue-light);
      color: var(--kz-blue-dark);
      font-size: 0.7rem;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 12px;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .term-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-dark);
      line-height: 1.35;
      word-break: break-word;
    }

    .term-sub {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 4px;
      font-weight: 600;
    }

    /* Сети вариантов ответов */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-dark);
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.02);
    }

    .option-btn:active:not(:disabled) {
      transform: scale(0.99);
      background: #F8FAFC;
    }

    .option-btn.correct {
      background-color: #FFFFFF !important;
      border-color: var(--correct-border) !important;
      color: var(--correct-text) !important;
    }

    .option-btn.wrong {
      background-color: #FFFFFF !important;
      border-color: var(--wrong-border) !important;
      color: var(--wrong-text) !important;
    }

    /* Блок пояснения / кнопки "Далее" (Зафиксирован по высоте, чтобы ничего не прыгало) */
    .explanation-box {
      min-height: 52px;
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 0.82rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-left: 5px solid var(--kz-blue);
      background: var(--kz-blue-light);
      color: var(--kz-blue-dark);
    }

    .explanation-box.correct-mode {
      border-left-color: var(--correct-border);
      background: var(--correct-bg);
      color: var(--correct-text);
    }

    .explanation-box.wrong-mode {
      border-left-color: var(--wrong-border);
      background: var(--wrong-bg);
      color: var(--wrong-text);
    }

    .next-action-btn {
      background: var(--kz-blue);
      color: #FFFFFF;
      border: none;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      margin-left: 10px;
      flex-shrink: 0;
      transition: background 0.2s ease;
    }

    .next-action-btn:active {
      background: var(--kz-blue-dark);
    }
  </style>
</head>

      <div class="brand">@doctors.speak</div>
    </header>

    <div class="content">

        <option value="kaz-eng">Kaz ➔ Eng</option>

        <span>Streak: <span class="stat-val streak" id="streakCount">0 🔥</span></span>

      <div class="term-box">

      <div id="explanationBox" class="explanation-box">

        <button id="nextBtn" class="next-action-btn" style="display: none;" onclick="nextQuestion()">Next ➔</button>

    </div>
  </div>

      { eng: "morbidity", kaz: "аурушаңдық", rus: "заболеваемость", pron: "/mor-bi-di-ti/ • морбидити" },
      { eng: "mortality", kaz: "өлім-жітім", rus: "смертность", pron: "/mor-tal-i-ti/ • морталити" },
      { eng: "prognosis", kaz: "болжам", rus: "прогноз", pron: "/prog-no-sis/ • прогносис" },
      { eng: "progression", kaz: "үдеу", rus: "прогрессирование", pron: "/pro-gre-shən/ • прогрешн" },
      { eng: "recurrence", kaz: "қайталану", rus: "рецидив", pron: "/ri-kar-əns/ • рикаренс" },
      { eng: "remission", kaz: "ремиссия", rus: "ремиссия", pron: "/ri-mi-shən/ • ремишн" },
      { eng: "response", kaz: "жауап", rus: "ответ", pron: "/ri-spons/ • респонс" },
      { eng: "risk", kaz: "қауіп", rus: "риск", pron: "/risk/ • риск" },
      { eng: "safety", kaz: "қауіпсіздік", rus: "безопасность", pron: "/sei-f-ti/ • сейфти" },
      { eng: "side effect", kaz: "жанама әсер", rus: "побочный эффект", pron: "/said i-fekt/ • сайд эффект" },
      { eng: "tolerability", kaz: "төзімділік", rus: "переносимость", pron: "/to-le-ra-bi-li-ti/ • толерабилити" },
      { eng: "finally", kaz: "ақыры", rus: "наконец", pron: "/fai-nə-li/ • файнали" },
      { eng: "firstly/secondly", kaz: "біріншіден / екіншіден", rus: "во-первых / во-вторых", pron: "/f3:st-li / sek-ənd-li/ • фёрстли / секондли" },
      { eng: "for example", kaz: "мысалы", rus: "например", pron: "/fɔ:r ig-zam-pl/ • фор игзампл" },
      { eng: "for instance", kaz: "мысалы", rus: "например", pron: "/fɔ:r in-stəns/ • фор инстанс" },
      { eng: "furthermore", kaz: "сонымен қатар", rus: "более того", pron: "/f3:r-ðər-mɔ:r/ • фёрдермор" },
      { eng: "importantly", kaz: "маңыздысы", rus: "важно", pron: "/im-pɔ:t-ənt-li/ • импортантли" },
      { eng: "in addition", kaz: "оған қоса", rus: "кроме того", pron: "/in ə-di-shən/ • ин адишн" },
      { eng: "in conclusion", kaz: "қорытындылай келе", rus: "в заключение", pron: "/in kən-klu-zən/ • ин конклюжн" },
      { eng: "in particular", kaz: "әсіресе", rus: "в частности", pron: "/in pə-tik-jə-lər/ • ин партикьюлар" },
      { eng: "in summary", kaz: "қорытындысында", rus: "в заключение", pron: "/in sam-ə-ri/ • ин саммери" },
      { eng: "moreover", kaz: "оған қоса", rus: "более того", pron: "/mor-ǝu-vər/ • мороувер" },
      { eng: "notably", kaz: "әсіресе", rus: "особенно", pron: "/nou-tə-bli/ • ноутэбли" },
      { eng: "overall", kaz: "жалпы", rus: "в целом", pron: "/ou-vər-ə:l/ • оувералл" },
      { eng: "regarding", kaz: "қатысты", rus: "относительно", pron: "/ri-ga:r-din/ • ригардинг" },
      { eng: "with respect to", kaz: "қатысты", rus: "в отношении", pron: "/wið ri-spekt tu/ • уид респект ту" },

      { eng: "robust", kaz: "тұрақты", rus: "устойчивый", pron: "/rou-bast/ • робаст" },

      { eng: "unclear", kaz: "түсініксіз", rus: "неясный", pron: "/an-kliər/ • анклиэр" },
      { eng: "valid", kaz: "жарамды", rus: "действительный", pron: "/va-lid/ • валид" },

    ];

    let total = 0;
    let correct = 0;
    let streak = 0;
    let currentItem = null;
    let answered = false;

    function getRandomItem() {
      return vocabulary[Math.floor(Math.random() * vocabulary.length)];
    }

    function shuffle(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function resetAndNext() {
      nextQuestion();
    }

    function nextQuestion() {
      answered = false;
      
      const expBox = document.getElementById('explanationBox');
      expBox.className = 'explanation-box';
      document.getElementById('explanationText').textContent = '💡 Choose the correct answer!';
      document.getElementById('nextBtn').style.display = 'none';

      const mode = document.getElementById('modeSelect').value;
      currentItem = getRandomItem();

      let questionText = "";
      let subText = "";
      let correctAnswer = "";
      let answerKey = "";

      if (mode === 'eng-kaz') {
        questionText = currentItem.eng;
        subText = currentItem.pron || "";
        correctAnswer = currentItem.kaz;
        answerKey = 'kaz';
      } else if (mode === 'eng-rus') {
        questionText = currentItem.eng;
        subText = currentItem.pron || "";
        correctAnswer = currentItem.rus;
        answerKey = 'rus';
      } else if (mode === 'kaz-eng') {
        questionText = currentItem.kaz;
        subText = "Қазақша ➔ English";
        correctAnswer = currentItem.eng;
        answerKey = 'eng';
      } else if (mode === 'rus-eng') {
        questionText = currentItem.rus;
        subText = "Русский ➔ English";
        correctAnswer = currentItem.eng;
        answerKey = 'eng';
      }

      document.getElementById('termText').textContent = questionText;
      document.getElementById('termSub').textContent = subText;

      let options = [correctAnswer];
      while (options.length < 3) {
        let rand = getRandomItem()[answerKey];
        if (!options.includes(rand)) {
          options.push(rand);
        }
      }
      options = shuffle(options);

      const grid = document.getElementById('optionsGrid');
      grid.innerHTML = '';

      const letters = ['A', 'B', 'C'];
      options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.dataset.val = opt;

        btn.textContent = `${letters[idx]}) ${opt}`;

        btn.onclick = () => selectOption(btn, opt === correctAnswer);
        grid.appendChild(btn);
      });
    }

    function selectOption(selectedBtn, isCorrect) {
      if (answered) return;
      answered = true;

      total++;
      const expBox = document.getElementById('explanationBox');
      const mode = document.getElementById('modeSelect').value;
      let rightAns = (mode === 'eng-kaz') ? currentItem.kaz :
                     (mode === 'eng-rus') ? currentItem.rus : currentItem.eng;

      if (isCorrect) {
        correct++;
        streak++;
        selectedBtn.classList.add('correct');
        expBox.className = 'explanation-box correct-mode';
        document.getElementById('explanationText').textContent = '🎉 Correct! Well done.';
      } else {
        streak = 0;
        selectedBtn.classList.add('wrong');
        expBox.className = 'explanation-box wrong-mode';
        document.getElementById('explanationText').textContent = `❌ Correct: ${rightAns}`;

        document.querySelectorAll('.option-btn').forEach(b => {
          if (b.dataset.val === rightAns) b.classList.add('correct');
        });
      }

      document.getElementById('totalCount').textContent = total;
      document.getElementById('correctCount').textContent = correct;
      document.getElementById('streakCount').textContent = streak + " 🔥";
      document.getElementById('nextBtn').style.display = 'inline-block';
    }
  </script>
