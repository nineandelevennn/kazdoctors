<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>@doctors.speak — Anatomy Vocabulary Trainer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --kz-blue: #00A1DE;
      --kz-blue-dark: #0077A3;
      --kz-blue-light: #EBF8FC;
      --kz-gold: #FFC72C;
      --bg-main: #F2F5F8;
      --card-bg: #FFFFFF;
      --text-dark: #1E293B;
      --text-muted: #64748B;
      --border-color: #E2E8F0;
      --correct-bg: #E6F4EA;
      --correct-border: #34A853;
      --correct-text: #137333;
      --wrong-bg: #FCE8E6;
      --wrong-border: #EA4335;
      --wrong-text: #C5221F;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-main);
      color: var(--text-dark);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    /* Главный контейнер карточки */
    .card {
      position: relative;
      background: var(--card-bg);
      border-radius: 28px;
      width: 100%;
      max-width: 420px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }

    /* Яркая голубая шапка */
    .header {
      background: var(--kz-blue);
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .home-btn {
      background: rgba(255, 255, 255, 0.25);
      color: #FFFFFF;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 8px 16px;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      transition: background 0.2s ease;
    }

    .home-btn:active {
      background: rgba(255, 255, 255, 0.4);
    }

    .brand {
      background: rgba(255, 255, 255, 0.25);
      color: #FFFFFF;
      font-weight: 800;
      font-size: 0.8rem;
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      letter-spacing: 0.5px;
    }

    /* Содержимое карточки */
    .content {
      padding: 18px 20px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Выбор режима */
    .mode-select {
      width: 100%;
      padding: 9px 14px;
      border: 1px solid #D0E4EC;
      border-radius: 12px;
      font-weight: 700;
      color: var(--kz-blue-dark);
      background: var(--kz-blue-light);
      outline: none;
      font-size: 0.82rem;
      cursor: pointer;
      text-align: center;
    }

    /* Статистика */
    .stats-bar {
      background: #F8FAFC;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-dark);
    }

    .stat-val {
      font-weight: 800;
    }

    .stat-val.correct {
      color: #22C55E;
    }

    .stat-val.streak {
      color: #F59E0B;
    }

    /* Блок вопроса с желтой полоской слева */
    .term-box {
      position: relative;
      border: 1px solid #E2E8F0;
      border-radius: 20px;
      padding: 24px 18px;
      text-align: center;
      min-height: 150px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #FFFFFF;
      overflow: hidden;
    }

    .term-box::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 6px;
      background: var(--kz-gold);
    }

    .level-badge {
      display: inline-block;
      background: var(--kz-blue-light);
      color: var(--kz-blue-dark);
      font-size: 0.7rem;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 12px;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .term-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-dark);
      line-height: 1.35;
      word-break: break-word;
    }

    .term-sub {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 4px;
      font-weight: 600;
    }

    /* Сети вариантов ответов */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-dark);
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.02);
    }

    .option-btn:active:not(:disabled) {
      transform: scale(0.99);
      background: #F8FAFC;
    }

    .option-btn.correct {
      background-color: #FFFFFF !important;
      border-color: var(--correct-border) !important;
      color: var(--correct-text) !important;
    }

    .option-btn.wrong {
      background-color: #FFFFFF !important;
      border-color: var(--wrong-border) !important;
      color: var(--wrong-text) !important;
    }

    /* Блок пояснения / кнопки "Далее" (Зафиксирован по высоте, чтобы ничего не прыгало) */
    .explanation-box {
      min-height: 52px;
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 0.82rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-left: 5px solid var(--kz-blue);
      background: var(--kz-blue-light);
      color: var(--kz-blue-dark);
    }

    .explanation-box.correct-mode {
      border-left-color: var(--correct-border);
      background: var(--correct-bg);
      color: var(--correct-text);
    }

    .explanation-box.wrong-mode {
      border-left-color: var(--wrong-border);
      background: var(--wrong-bg);
      color: var(--wrong-text);
    }

    .next-action-btn {
      background: var(--kz-blue);
      color: #FFFFFF;
      border: none;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      margin-left: 10px;
      flex-shrink: 0;
      transition: background 0.2s ease;
    }

    .next-action-btn:active {
      background: var(--kz-blue-dark);
    }
  </style>
</head>
<body>

  <div class="card">
    <header class="header">
      <a href="https://kazdoctors.com" class="home-btn">← Go back</a>
      <div class="brand">@doctors.speak</div>
    </header>

    <div class="content">
      <select id="modeSelect" class="mode-select" onchange="resetAndNext()">
        <option value="eng-kaz">Eng ➔ Kaz</option>
        <option value="eng-rus">Eng ➔ Rus</option>
        <option value="kaz-eng">Kaz ➔ Eng</option>
        <option value="rus-eng">Rus ➔ Eng</option>
      </select>

      <div class="stats-bar">
        <span>Total: <span class="stat-val" id="totalCount">0</span></span>
        <span>Correct: <span class="stat-val correct" id="correctCount">0</span></span>
        <span>Streak: <span class="stat-val streak" id="streakCount">0 🔥</span></span>
      </div>

      <div class="term-box">
        <span class="level-badge" id="levelBadge">ANATOMY</span>
        <div id="termText" class="term-title">Heart</div>
        <div id="termSub" class="term-sub">/ha:rt/</div>
      </div>

      <div id="optionsGrid" class="options-grid"></div>

      <!-- Постоянный фиксированный блок, чтобы текст не подпрыгивал при выборе вариантов -->
      <div id="explanationBox" class="explanation-box">
        <span id="explanationText">💡 Choose the correct answer!</span>
        <button id="nextBtn" class="next-action-btn" style="display: none;" onclick="nextQuestion()">Next ➔</button>
      </div>
    </div>
  </div>

  <script>
    const vocabulary = [
      { eng: "Heart", kaz: "Жүрек", rus: "Сердце", pron: "/ha:rt/" },
      { eng: "Connective tissue", kaz: "Дәнекер тін", rus: "Соединительная ткань", pron: "/kə'nektiv 'tıfu:/" },
      { eng: "Lung", kaz: "Өкпе", rus: "Лёгкое", pron: "/laŋ/" },
      { eng: "Ligament", kaz: "Байлам", rus: "Связка", pron: "/'lıgəmənt/" },
      { eng: "Liver", kaz: "Бауыр", rus: "Печень", pron: "/'lıvər/" },
      { eng: "Tendon", kaz: "Сіңір", rus: "Сухожилие", pron: "/'tendən/" },
      { eng: "Stomach", kaz: "Асқазан", rus: "Желудок", pron: "/'stamǝk/" },
      { eng: "Kidney", kaz: "Бүйрек", rus: "Почка", pron: "/'kıdni/" },
      { eng: "Intestine", kaz: "Ішек", rus: "Кишечник", pron: "/In'testin/" },
      { eng: "Bladder", kaz: "Қуық", rus: "Мочевой пузырь", pron: "/'blædər/" },
      { eng: "Pancreas", kaz: "Ұйқыбез", rus: "Поджелудочная железа", pron: "/'pæŋkriǝs/" },
      { eng: "Cartilage", kaz: "Шеміршек", rus: "Хрящ", pron: "/'ka:rtəlıdz/" },
      { eng: "Joint", kaz: "Буын", rus: "Сустав", pron: "/dzɔınt/" },
      { eng: "Bone marrow", kaz: "Сүйек кемігі", rus: "Костный мозг", pron: "/boon 'mærou/" },
      { eng: "Fascia", kaz: "Фасция", rus: "Фасция", pron: "/'fæfiǝ/" },
      { eng: "Synovial fluid", kaz: "Синовиальды сұйықтық", rus: "Синовиальная жидкость", pron: "/sı'nouviǝl 'flu:id/" },
      { eng: "Meniscus", kaz: "Мениск", rus: "Мениск", pron: "/mə'nıskəs/" },
      { eng: "Bursa", kaz: "Бурса", rus: "Бурса", pron: "/'b3:rsǝ/" },
      { eng: "Spleen", kaz: "Көкбауыр", rus: "Селезёнка", pron: "/spli:n/" },
      { eng: "Esophagus", kaz: "Өңеш", rus: "Пищевод", pron: "/ı'sa:fəgəs/" },
      { eng: "Trachea", kaz: "Кеңірдек", rus: "Трахея", pron: "/'treikiǝ/" },
      { eng: "Thyroid gland", kaz: "Қалқанша без", rus: "Щитовидная железа", pron: "/'θaırɔıd glænd/" },
      { eng: "Gallbladder", kaz: "Өт қабы", rus: "Желчный пузырь", pron: "/'gɔ:lblædər/" },
      { eng: "Appendix", kaz: "Соқырішек өсіндісі", rus: "Аппендикс", pron: "/ə'pendıks/" },
      { eng: "Brain", kaz: "Ми", rus: "Мозг", pron: "/brein/" },
      { eng: "Ureter", kaz: "Несепағар", rus: "Мочеточник", pron: "/'yoōrədər/" },
      { eng: "Ovary", kaz: "Аналық без", rus: "Яичник", pron: "/'ōv(ə)rē/" },
      { eng: "Uterus", kaz: "Жатыр", rus: "Матка", pron: "/'yoōdərəs/" },
      { eng: "Cervix", kaz: "Жатыр мойны", rus: "Шейка матки", pron: "/'sərviks/" },
      { eng: "Adrenal gland", kaz: "Бүйрек үсті безі", rus: "Надпочечник", pron: "/ə'drēnal glænd/" },
      { eng: "Retina", kaz: "Торлы қабық", rus: "Сетчатка", pron: "/'retənə/" },
      { eng: "Skull", kaz: "Бас сүйек", rus: "Череп", pron: "/skal/" },
      { eng: "Muscle", kaz: "Бұлшықет", rus: "Мышца", pron: "/'masəl/" },
      { eng: "Jaw", kaz: "Жақ", rus: "Челюсть", pron: "/dzɔ:/" },
      { eng: "Biceps", kaz: "Бицепс", rus: "Бицепс", pron: "/'baıseps/" },
      { eng: "Clavicle", kaz: "Бұғана", rus: "Ключица", pron: "/'klævıkəl/" },
      { eng: "Triceps", kaz: "Трицепс", rus: "Трицепс", pron: "/'traıseps/" },
      { eng: "Scapula", kaz: "Жауырын", rus: "Лопатка", pron: "/'skæpjulə/" },
      { eng: "Deltoid", kaz: "Дельта тәрізді бұлшықет", rus: "Дельтовидная мышца", pron: "/'deltoıd/" },
      { eng: "Sternum", kaz: "Төс сүйек", rus: "Грудина", pron: "/'st3:rnəm/" },
      { eng: "Pectoral muscle", kaz: "Кеуде бұлшықеті", rus: "Грудная мышца", pron: "/'pektərəl 'masəl/" },
      { eng: "Rib", kaz: "Қабырға", rus: "Ребро", pron: "/rib/" },
      { eng: "Abdominal muscle", kaz: "Іш бұлшықеті", rus: "Брюшная мышца", pron: "/æb'da:mınəl 'masəl/" },
      { eng: "Spine", kaz: "Омыртқа", rus: "Позвоночник", pron: "/spain/" },
      { eng: "Latissimus dorsi", kaz: "Арқаның жалпақ бұлшықеті", rus: "Широчайшая мышца спины", pron: "/lə'tısıməs 'dɔ:rsaı/" },
      { eng: "Vertebra", kaz: "Омыртқа", rus: "Позвонок", pron: "/'v3:rtıbrə/" },
      { eng: "Trapezius", kaz: "Трапеция бұлшықеті", rus: "Трапециевидная мышца", pron: "/trə'pi:ziəs/" },
      { eng: "Pelvis", kaz: "Жамбас", rus: "Таз", pron: "/'pelvis/" },
      { eng: "Gluteus", kaz: "Бөксе бұлшықеті", rus: "Ягодичная мышца", pron: "/'glu:tiəs/" },
      { eng: "Humerus", kaz: "Иық сүйегі", rus: "Плечевая кость", pron: "/'hju:mərəs/" },
      { eng: "Quadriceps", kaz: "Төртбасты бұлшықет", rus: "Четырёхглавая мышца", pron: "/'kwa:drıseps/" },
      { eng: "Radius", kaz: "Кәрі жілік", rus: "Лучевая кость", pron: "/'reıdiəs/" },
      { eng: "Hamstring", kaz: "Санның артқы бұлшықеті", rus: "Подколенное сухожилие", pron: "/'hæmstrıŋ/" },
      { eng: "Ulna", kaz: "Шынтақ сүйек", rus: "Локтевая кость", pron: "/'alna/" },
      { eng: "Calf muscle", kaz: "Балтыр бұлшықеті", rus: "Икроножная мышца", pron: "/kæf 'masəl/" },
      { eng: "Femur", kaz: "Ортан жілік", rus: "Бедренная кость", pron: "/'fi:mər/" },
      { eng: "Diaphragm", kaz: "Көкет", rus: "Диафрагма", pron: "/'daıəfræm/" },
      { eng: "Patella", kaz: "Тізе тобығы", rus: "Надколенник", pron: "/pə'telə/" },
      { eng: "Tibia", kaz: "Асық жілік", rus: "Большеберцовая кость", pron: "/'tıbiə/" },
      { eng: "Fibula", kaz: "Шыбық сүйек", rus: "Малоберцовая кость", pron: "/'fıbjulə/" }
    ];

    let total = 0;
    let correct = 0;
    let streak = 0;
    let currentItem = null;
    let answered = false;

    function getRandomItem() {
      return vocabulary[Math.floor(Math.random() * vocabulary.length)];
    }

    function shuffle(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function resetAndNext() {
      nextQuestion();
    }

    function nextQuestion() {
      answered = false;
      
      const expBox = document.getElementById('explanationBox');
      expBox.className = 'explanation-box';
      document.getElementById('explanationText').textContent = '💡 Choose the correct answer!';
      document.getElementById('nextBtn').style.display = 'none';

      const mode = document.getElementById('modeSelect').value;
      currentItem = getRandomItem();

      let questionText = "";
      let subText = "";
      let correctAnswer = "";
      let answerKey = "";

      if (mode === 'eng-kaz') {
        questionText = currentItem.eng;
        subText = currentItem.pron || "";
        correctAnswer = currentItem.kaz;
        answerKey = 'kaz';
      } else if (mode === 'eng-rus') {
        questionText = currentItem.eng;
        subText = currentItem.pron || "";
        correctAnswer = currentItem.rus;
        answerKey = 'rus';
      } else if (mode === 'kaz-eng') {
        questionText = currentItem.kaz;
        subText = "Қазақша ➔ English";
        correctAnswer = currentItem.eng;
        answerKey = 'eng';
      } else if (mode === 'rus-eng') {
        questionText = currentItem.rus;
        subText = "Русский ➔ English";
        correctAnswer = currentItem.eng;
        answerKey = 'eng';
      }

      document.getElementById('termText').textContent = questionText;
      document.getElementById('termSub').textContent = subText;

      let options = [correctAnswer];
      while (options.length < 3) {
        let rand = getRandomItem()[answerKey];
        if (!options.includes(rand)) {
          options.push(rand);
        }
      }
      options = shuffle(options);

      const grid = document.getElementById('optionsGrid');
      grid.innerHTML = '';

      const letters = ['A', 'B', 'C'];
      options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.dataset.val = opt;

        btn.textContent = `${letters[idx]}) ${opt}`;

        btn.onclick = () => selectOption(btn, opt === correctAnswer);
        grid.appendChild(btn);
      });
    }

    function selectOption(selectedBtn, isCorrect) {
      if (answered) return;
      answered = true;

      total++;
      const expBox = document.getElementById('explanationBox');
      const mode = document.getElementById('modeSelect').value;
      let rightAns = (mode === 'eng-kaz') ? currentItem.kaz :
                     (mode === 'eng-rus') ? currentItem.rus : currentItem.eng;

      if (isCorrect) {
        correct++;
        streak++;
        selectedBtn.classList.add('correct');
        expBox.className = 'explanation-box correct-mode';
        document.getElementById('explanationText').textContent = '🎉 Correct! Well done.';
      } else {
        streak = 0;
        selectedBtn.classList.add('wrong');
        expBox.className = 'explanation-box wrong-mode';
        document.getElementById('explanationText').textContent = `❌ Correct: ${rightAns}`;

        document.querySelectorAll('.option-btn').forEach(b => {
          if (b.dataset.val === rightAns) b.classList.add('correct');
        });
      }

      document.getElementById('totalCount').textContent = total;
      document.getElementById('correctCount').textContent = correct;
      document.getElementById('streakCount').textContent = streak + " 🔥";
      document.getElementById('nextBtn').style.display = 'inline-block';
    }

    window.onload = function() {
      nextQuestion();
    };
  </script>
</body>
</html>
