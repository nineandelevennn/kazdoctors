<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Doctors Speak — Clinical English Practice (TBLT)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: #F8FAFC;
      --bg-card: #FFFFFF;
      --bg-subtle: #F1F5F9;
      --text-primary: #0F172A;
      --text-secondary: #334155;
      --text-muted: #64748B;
      --med-navy: #0B3555;
      --kz-blue: #0284C7;
      --kz-blue-soft: #E0F2FE;
      --kz-gold: #F5B700;
      --kz-gold-soft: #FEF9C3;
      --teal-accent: #0D9488;
      --teal-soft: #F0FDFA;
      --teal-border: #99F6E4;
      --red-soft: #FEF2F2;
      --red-border: #FECACA;
      --red-text: #B91C1C;
      --border-light: #E2E8F0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-page);
      color: var(--text-primary);
      line-height: 1.48;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 48px;
      -webkit-font-smoothing: antialiased;
    }

    /* Шапка */
    header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-light);
      position: sticky;
      top: 0;
      z-index: 40;
      padding: 12px 14px;
    }

    .header-inner {
      max-width: 640px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .back-link {
      text-decoration: none;
      color: var(--text-secondary);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 7px;
      border: 1px solid var(--border-light);
      background: var(--bg-page);
      cursor: pointer;
    }

    .back-link:hover {
      border-color: var(--kz-blue);
      color: var(--med-navy);
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .free-badge {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 6px;
      background: var(--teal-soft);
      color: var(--teal-accent);
      border: 1px solid var(--teal-border);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .lang-switch {
      display: inline-flex;
      background: var(--bg-page);
      border: 1px solid var(--border-light);
      border-radius: 6px;
      padding: 2px;
    }

    .lang-btn {
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 4px;
      cursor: pointer;
    }

    .lang-btn.active {
      background: var(--med-navy);
      color: #FFFFFF;
    }

    /* Прогресс кейса */
    .progress-row {
      display: none;
      align-items: center;
      gap: 6px;
    }

    .progress-row.visible {
      display: flex;
    }

    .prog-step {
      flex: 1;
      height: 5px;
      border-radius: 4px;
      background: var(--border-light);
      transition: background 0.25s ease;
    }

    .prog-step.done {
      background: var(--teal-accent);
    }

    .prog-step.current {
      background: var(--kz-blue);
    }

    /* Основной контейнер */
    main {
      width: 100%;
      max-width: 640px;
      margin: 16px auto 0 auto;
      padding: 0 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.025);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .mission-kicker {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--kz-blue);
      background: var(--kz-blue-soft);
      padding: 4px 9px;
      border-radius: 6px;
      align-self: flex-start;
    }

    .mission-kicker.reading {
      color: var(--sun-ink);
      background: var(--kz-gold-soft);
    }

    .mission-kicker.closing {
      color: var(--teal-accent);
      background: var(--teal-soft);
    }

    h1 {
      font-size: 1.16rem;
      font-weight: 800;
      color: var(--med-navy);
      line-height: 1.3;
    }

    h2 {
      font-size: 1rem;
      font-weight: 800;
      color: var(--med-navy);
      line-height: 1.3;
    }

    .lead-text {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    /* Список 3 задач на выбор */
    .cases-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .case-card {
      width: 100%;
      text-align: left;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 15px 16px;
      cursor: pointer;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .case-card:hover {
      border-color: var(--kz-blue);
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.08);
    }

    .case-card:active {
      transform: scale(0.995);
    }

    .case-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .case-tag {
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--kz-blue);
      background: var(--kz-blue-soft);
      padding: 3px 8px;
      border-radius: 5px;
    }

    .case-meta {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .case-done-pill {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--teal-accent);
      background: var(--teal-soft);
      border: 1px solid var(--teal-border);
      padding: 2px 8px;
      border-radius: 5px;
    }

    .case-title {
      font-size: 0.96rem;
      font-weight: 800;
      color: var(--med-navy);
      line-height: 1.3;
    }

    .case-desc {
      font-size: 0.81rem;
      color: var(--text-secondary);
      line-height: 1.42;
    }

    .case-skills-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 2px;
    }

    .skill-chip {
      font-size: 0.69rem;
      font-weight: 600;
      color: var(--text-secondary);
      background: var(--bg-subtle);
      padding: 2px 7px;
      border-radius: 5px;
    }

    .case-start-line {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--kz-blue);
      margin-top: 2px;
    }

    /* Бриф пациента перед шагом 1 */
    .patient-brief {
      background: var(--bg-page);
      border: 1px solid var(--border-light);
      border-left: 4px solid var(--med-navy);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .brief-label {
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .brief-content {
      font-size: 0.83rem;
      color: var(--text-primary);
      font-weight: 500;
    }

    /* Реплика пациента */
    .patient-bubble {
      background: var(--sky-50);
      border: 1px solid var(--sky-100);
      border-radius: 12px;
      padding: 13px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .pb-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .pb-role {
      font-size: 0.71rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--kz-blue);
    }

    .audio-btn {
      border: 1px solid var(--sky-100);
      background: #FFFFFF;
      color: var(--med-navy);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .audio-btn:hover {
      background: var(--kz-blue-soft);
    }

    .pb-quote {
      font-size: 0.94rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.4;
    }

    .pb-hint-toggle {
      align-self: flex-start;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.73rem;
      font-weight: 600;
      text-decoration: underline;
      cursor: pointer;
    }

    .pb-translation {
      display: none;
      font-size: 0.79rem;
      color: var(--text-secondary);
      border-top: 1px dashed var(--sky-100);
      padding-top: 6px;
    }

    .pb-translation.visible {
      display: block;
    }

    /* Блок клинического текста (Reading task) */
    .clinical-doc {
      background: var(--bg-page);
      border: 1px solid var(--border-light);
      border-radius: 10px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .doc-header {
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-light);
      padding-bottom: 6px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .doc-text {
      font-size: 0.88rem;
      color: var(--text-primary);
      line-height: 1.55;
    }

    .doc-text mark {
      background: var(--kz-gold-soft);
      color: var(--text-primary);
      padding: 1px 4px;
      border-radius: 4px;
      font-weight: 600;
    }

    /* Задача врача */
    .task-prompt {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    /* Варианты ответа */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .opt-btn {
      width: 100%;
      text-align: left;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 0.87rem;
      font-weight: 600;
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.15s ease;
      line-height: 1.38;
    }

    .opt-btn:hover:not(:disabled) {
      border-color: var(--kz-blue);
      background: var(--bg-page);
    }

    .opt-btn.correct {
      background: var(--teal-soft);
      border-color: var(--teal-accent);
      color: #0F766E;
      font-weight: 700;
    }

    .opt-btn.wrong {
      background: var(--red-soft);
      border-color: var(--red-border);
      color: var(--red-text);
    }

    /* Обратная связь (Task Feedback + Что подучить) */
    .feedback-box {
      display: flex;
      border-radius: 10px;
      padding: 13px 14px;
      font-size: 0.83rem;
      line-height: 1.48;
      border: 1px solid var(--border-light);
      flex-direction: column;
      gap: 8px;
    }

    .feedback-box.ok {
      background: var(--teal-soft);
      border-color: var(--teal-border);
      color: #115E59;
    }

    .feedback-box.wrong-fb {
      background: var(--sun-50);
      border-color: #FDE68A;
      color: var(--sun-ink);
    }

    .fb-title {
      font-weight: 800;
      font-size: 0.84rem;
    }

    .fb-mistake-note {
      background: rgba(255, 255, 255, 0.72);
      border-left: 3px solid var(--sun-ink);
      padding: 8px 10px;
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 0.81rem;
    }

    .study-tip-box {
      background: var(--bg-card);
      border: 1px solid var(--sky-100);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      color: var(--text-primary);
    }

    .study-tip-label {
      font-size: 0.69rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--kz-blue);
    }

    .study-tip-topic {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--med-navy);
    }

    .study-tip-desc {
      font-size: 0.78rem;
      color: var(--text-secondary);
    }

    .study-tip-link {
      align-self: flex-start;
      margin-top: 2px;
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--kz-blue);
      text-decoration: none;
    }

    .study-tip-link:hover {
      text-decoration: underline;
    }

    /* Кнопки действий */
    .primary-btn {
      width: 100%;
      background: var(--med-navy);
      color: #FFFFFF;
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      transition: background 0.15s ease;
    }

    .primary-btn:hover {
      background: var(--kz-blue);
    }

    .primary-btn.gold {
      background: var(--kz-gold);
      color: var(--med-navy);
      font-weight: 800;
    }

    .primary-btn.gold:hover {
      background: #EAB308;
    }

    .secondary-btn {
      width: 100%;
      background: var(--bg-card);
      color: var(--med-navy);
      border: 1px solid var(--border-light);
      border-radius: 10px;
      padding: 11px 16px;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: inline-block;
    }

    .secondary-btn:hover {
      border-color: var(--kz-blue);
      background: var(--bg-page);
    }

    /* Финальный экран TBLT Language Focus */
    .score-banner {
      background: var(--med-navy);
      color: #FFFFFF;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .score-num {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--kz-gold);
    }

    .chunk-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chunk-item {
      background: var(--bg-page);
      border: 1px solid var(--border-light);
      border-radius: 9px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .chunk-en {
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--med-navy);
      cursor: pointer;
    }

    .chunk-en:hover {
      color: var(--kz-blue);
    }

    .chunk-meta {
      font-size: 0.76rem;
      color: var(--text-secondary);
    }

    .gap-card {
      background: var(--sun-50);
      border: 1px solid #FDE68A;
      border-radius: 10px;
      padding: 14px;
      font-size: 0.82rem;
      color: var(--sun-ink);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .gap-plan-item {
      background: #FFFFFF;
      border: 1px solid #FDE68A;
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      color: var(--text-primary);
    }

    .actions-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 4px;
    }
  </style>

</head>

    // =========================================================================
    // 3. СОСТОЯНИЕ, СОХРАНЕНИЕ ПРОГРЕССА И ЛОГИКА

    let currentLang = localStorage.getItem('selected_lang') || 'ru';
    // screenState: 'menu' | 'step' | 'summary'
    let screenState = 'menu';
    let activeCase = null;
    let shuffledSteps = [];
    let stepIndex = 0;
    let answeredCurrent = false;
    let selectedOptIdx = null;
    let score = 0;
    let missedStudies = [];

    function getSavedResults() {
      try {
        return JSON.parse(localStorage.getItem('ds_tblt_results') || '{}');
      } catch (e) {
        return {};
      }
    }

    function saveCaseResult(caseId, sc, total) {
      const results = getSavedResults();
      results[caseId] = { score: sc, total: total };
      localStorage.setItem('ds_tblt_results', JSON.stringify(results));
    }

    function getOptionText(opt) {
      if (typeof opt.text === 'string') return opt.text;
      return opt.text[currentLang] || opt.text.ru;
    }

    function setLang(lang) {
      currentLang = lang;
      localStorage.setItem('selected_lang', lang);
      document.documentElement.lang = lang;
      document.getElementById('btnRu').classList.toggle('active', lang === 'ru');
      document.getElementById('btnKz').classList.toggle('active', lang === 'kz');
      render();
    }

    function handleBackClick() {
      if (screenState === 'menu') {
        window.location.href = 'https://kazdoctors.com/';
      } else {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        screenState = 'menu';
        activeCase = null;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function startCase(caseId) {
      const found = CLINICAL_CASES.find(c => c.id === caseId);
      if (!found) return;

      activeCase = found;
      score = 0;
      missedStudies = [];
      stepIndex = 0;
      answeredCurrent = false;
      selectedOptIdx = null;

      shuffledSteps = found.steps.map(st => {
        const optsCopy = st.options.map(o => ({ ...o }));
        for (let i = optsCopy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [optsCopy[i], optsCopy[j]] = [optsCopy[j], optsCopy[i]];
        }
        return { ...st, options: optsCopy };
      });

      screenState = 'step';
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function selectOption(optIdx) {
      if (answeredCurrent) return;
      answeredCurrent = true;
      selectedOptIdx = optIdx;

      const step = shuffledSteps[stepIndex];
      const chosen = step.options[optIdx];
      if (chosen.correct) {
        score++;
      } else {
        missedStudies.push(step.study);
      }
      render();
    }

    function goNext() {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();

      if (stepIndex + 1 < shuffledSteps.length) {
        stepIndex++;
        answeredCurrent = false;
        selectedOptIdx = null;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        saveCaseResult(activeCase.id, score, shuffledSteps.length);
        screenState = 'summary';
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function speakText(text) {
      if (!('speechSynthesis' in window) || !text) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = 0.9;
      window.speechSynthesis.speak(u);
    }

    function speakCurrentPatientLine() {
      if (!shuffledSteps[stepIndex] || !shuffledSteps[stepIndex].patientLine) return;
      speakText(shuffledSteps[stepIndex].patientLine);
    }

    function speakChunkByIdx(idx) {
      if (!activeCase || !activeCase.steps[idx]) return;
      speakText(activeCase.steps[idx].chunk.en);
    }

    function togglePatientTranslation() {
      const el = document.getElementById('patientTransBox');
      const btn = document.getElementById('patientTransBtn');
      if (!el || !btn) return;
      const isVis = el.classList.toggle('visible');
      btn.textContent = isVis ? UI_TEXT[currentLang].hideTransBtn : UI_TEXT[currentLang].showTransBtn;
    }

    function renderHeaderControls() {
      const t = UI_TEXT[currentLang];
      const backBtn = document.getElementById('uiBackBtn');
      const progRow = document.getElementById('progressRow');

      backBtn.textContent = (screenState === 'menu') ? t.backHome : t.backCases;

      if (screenState === 'menu' || !activeCase) {
        progRow.classList.remove('visible');
        progRow.innerHTML = '';
        return;
      }

      progRow.classList.add('visible');
      progRow.innerHTML = '';
      for (let i = 0; i < shuffledSteps.length; i++) {
        const bar = document.createElement('div');
        bar.className = 'prog-step';
        if (screenState === 'summary' || i < stepIndex) {
          bar.classList.add('done');
        } else if (i === stepIndex) {
          bar.classList.add('current');
        }
        progRow.appendChild(bar);
      }
    }

    function render() {
      renderHeaderControls();
      const root = document.getElementById('appRoot');
      const t = UI_TEXT[currentLang];

      // 1. ЭКРАН ВЫБОРА ИЗ 3 ЗАДАЧ
      if (screenState === 'menu') {
        const saved = getSavedResults();
        const cardsHtml = CLINICAL_CASES.map(c => {
          const res = saved[c.id];
          const doneHtml = res
            ? `<span class="case-done-pill">${t.doneLabel}: ${res.score}/${res.total}</span>`
            : `<span class="case-meta">${c.duration[currentLang]}</span>`;
          const skillsHtml = c.skills.map(s => `<span class="skill-chip">${s}</span>`).join('');

          return `
            <button type="button" class="case-card" onclick="startCase('${c.id}')">
              <div class="case-card-top">
                <span class="case-tag">${c.tag[currentLang]}</span>
                ${doneHtml}
              </div>
              <div class="case-title">${c.title[currentLang]}</div>
              <div class="case-desc">${c.desc[currentLang]}</div>
              <div class="case-skills-row">${skillsHtml}</div>
              <div class="case-start-line">${res ? t.retryCase : t.startCase}</div>
            </button>
          `;
        }).join('');

        root.innerHTML = `
          <div class="card">
            <span class="mission-kicker">${t.menuKicker}</span>
            <h1>${t.menuTitle}</h1>
            <p class="lead-text">${t.menuLead}</p>
            <div class="cases-grid">${cardsHtml}</div>
          </div>
        `;
        return;
      }

      // 2. ЭКРАН ПРОХОЖДЕНИЯ ШАГА
      if (screenState === 'step') {
        const step = shuffledSteps[stepIndex];
        const kickerClass = step.type === 'reading' ? 'reading' : (step.type === 'closing' ? 'closing' : '');

        const briefHtml = (stepIndex === 0) ? `
          <div class="patient-brief">
            <div class="brief-label">${t.briefLabel}</div>
            <div class="brief-content">${activeCase.brief[currentLang]}</div>
          </div>
        ` : '';

        let contextBlock = '';
        if (step.type === 'reading') {
          contextBlock = `
            <div class="clinical-doc">
              <div class="doc-header">
                <span>${step.docHeaderLeft}</span>
                <span>${step.docHeaderRight}</span>
              </div>
              <div class="doc-text">${step.docHtml}</div>
            </div>
          `;
        } else {
          contextBlock = `
            <div class="patient-bubble">
              <div class="pb-top">
                <span class="pb-role">${activeCase.patientRole}</span>
                <button type="button" class="audio-btn" onclick="speakCurrentPatientLine()">${t.listenBtn}</button>
              </div>
              <div class="pb-quote">"${step.patientLine}"</div>
              <button type="button" class="pb-hint-toggle" id="patientTransBtn" onclick="togglePatientTranslation()">${t.showTransBtn}</button>
              <div class="pb-translation" id="patientTransBox">${step.patientTrans[currentLang]}</div>
            </div>
          `;
        }

        const optionsHtml = step.options.map((opt, idx) => {
          let cls = 'opt-btn';
          if (answeredCurrent) {
            if (opt.correct) cls += ' correct';
            else if (idx === selectedOptIdx) cls += ' wrong';
          }
          return `
            <button type="button" class="${cls}" ${answeredCurrent ? 'disabled' : ''} onclick="selectOption(${idx})">
              ${getOptionText(opt)}
            </button>
          `;
        }).join('');

        let feedbackHtml = '';
        if (answeredCurrent) {
          const chosen = step.options[selectedOptIdx];
          const isCorrect = chosen.correct;
          const nextLabel = (stepIndex + 1 < shuffledSteps.length) ? t.nextStepBtn : t.finishBtn;

          if (isCorrect) {
            feedbackHtml = `
              <div class="feedback-box ok">
                <div class="fb-title">${t.okTitle}</div>
                <div>${step.feedback[currentLang]}</div>
              </div>
              <button type="button" class="primary-btn" onclick="goNext()">${nextLabel} →</button>
            `;
          } else {
            const specificReason = (chosen.whyWrong && chosen.whyWrong[currentLang])
              ? `<div class="fb-mistake-note">${chosen.whyWrong[currentLang]}</div>`
              : '';

            feedbackHtml = `
              <div class="feedback-box wrong-fb">
                <div class="fb-title">${t.wrongTitle}</div>
                ${specificReason}
                <div>${step.feedback[currentLang]}</div>
                <div class="study-tip-box">
                  <div class="study-tip-label">${t.studyLabel}</div>
                  <div class="study-tip-topic">${step.study.topic[currentLang]}</div>
                  <div class="study-tip-desc">${step.study.desc[currentLang]}</div>
                  <a href="${step.study.url}" class="study-tip-link" target="_blank">${t.studyLinkText}</a>
                </div>
              </div>
              <button type="button" class="primary-btn" onclick="goNext()">${nextLabel} →</button>
            `;
          }
        }

        root.innerHTML = `
          <div class="card">
            <span class="mission-kicker ${kickerClass}">${step.kicker[currentLang]}</span>
            ${briefHtml}
            ${contextBlock}
            <div class="task-prompt">${step.prompt[currentLang]}</div>
            <div class="options-list">${optionsHtml}</div>
            ${feedbackHtml}
          </div>
        `;
        return;
      }

      // 3. ЭКРАН ИТОГОВ И ПЕРСОНАЛЬНОГО ПЛАНА ОБУЧЕНИЯ
      if (screenState === 'summary') {
        const chunksHtml = activeCase.steps.map((s, idx) => `
          <div class="chunk-item">
            <div class="chunk-en" onclick="speakChunkByIdx(${idx})">${s.chunk.en}</div>
            <div class="chunk-meta">${s.chunk.note[currentLang]}</div>
          </div>
        `).join('');

        let gapHtml = '';
        if (missedStudies.length === 0) {
          gapHtml = `
            <div class="gap-card">
              <strong>${t.gapsTitle}</strong>
              <div>${t.gapsPerfect}</div>
            </div>
          `;
        } else {
          // Убираем дубликаты тем, если ошибки были в одном и том же разделе
          const seenTopics = new Set();
          const uniqueStudies = missedStudies.filter(st => {
            const key = st.topic.ru;
            if (seenTopics.has(key)) return false;
            seenTopics.add(key);
            return true;
          });

          const planItems = uniqueStudies.map(st => `
            <div class="gap-plan-item">
              <div class="study-tip-topic">${st.topic[currentLang]}</div>
              <div class="study-tip-desc">${st.desc[currentLang]}</div>
              <a href="${st.url}" class="study-tip-link">${t.studyLinkText}</a>
            </div>
          `).join('');

          gapHtml = `
            <div class="gap-card">
              <strong>${t.gapsTitle}</strong>
              <div>${t.gapsMixed}</div>
              ${planItems}
            </div>
          `;
        }

        root.innerHTML = `
          <div class="card">
            <div class="score-banner">
              <div class="score-num">${score} / ${shuffledSteps.length}</div>
              <div style="font-weight:800; font-size:0.95rem;">${t.summaryTitle}</div>
              <div style="font-size:0.79rem; color:var(--sky-100);">${t.summarySub}</div>
            </div>

            ${gapHtml}

            <div>
              <h2>${t.chunksTitle}</h2>
              <p class="lead-text" style="margin-top:3px; margin-bottom:10px;">${t.chunksSub}</p>
              <div class="chunk-list">${chunksHtml}</div>
            </div>

            <div class="actions-stack">
              <button type="button" class="primary-btn gold" onclick="handleBackClick()">${t.ctaOtherCases} →</button>
              <a href="https://kazdoctors.com/grammar/" class="secondary-btn">${t.ctaAllGrammar} →</a>
              <button type="button" class="secondary-btn" onclick="startCase('${activeCase.id}')">${t.ctaRestart}</button>
            </div>
          </div>
        `;
      }
    }

    setLang(currentLang);
  </script>
</body>
</html>
