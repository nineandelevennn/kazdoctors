<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctors Speak — Аудио-тренажер в дорогу (EN / KZ / RU)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Подключение Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --kz-blue: #00A1DE;
            --kz-blue-dark: #0077A3;
            --kz-blue-light: #EBF8FC;
            --kz-gold: #FFC72C;
            --kz-gold-dark: #D9A000;
            --kz-gold-light: #FFFBEB;
            --bg-main: #F0F6FA;
            --card-bg: #FFFFFF;
            --text-dark: #1E293B;
            --text-muted: #64748B;
            --border-color: #DBE5F0;
            --green-accent: #10B981;
            --green-light: #DCFCE7;
            --green-dark: #065F46;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-y: auto;
            background: radial-gradient(circle at top, #EBF8FC 0%, var(--bg-main) 60%);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding-bottom: 40px;
        }

        /* 1. Верхняя шапка в стиле INDEX FRIDAY */
        header {
            position: relative;
            z-index: 10;
            background: linear-gradient(150deg, #0082B8 0%, var(--kz-blue) 55%, #22B8CF 90%, var(--kz-gold) 135%);
            color: #FFFFFF;
            text-align: center;
            padding: 18px 16px 24px 16px;
            box-shadow: 0 8px 24px rgba(0, 161, 222, 0.22);
            border-bottom-left-radius: 26px;
            border-bottom-right-radius: 26px;
            overflow: hidden;
        }

        header::after {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 160px;
            height: 160px;
            background: radial-gradient(circle, rgba(255, 199, 44, 0.35) 0%, rgba(255, 199, 44, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .header-top-bar {
            width: 100%;
            max-width: 780px;
            margin: 0 auto 12px auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #FFFFFF;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.76rem;
            padding: 6px 14px;
            border-radius: 20px;
            transition: all 0.2s ease;
        }

        .back-btn:active {
            transform: scale(0.96);
        }

        .header-badges {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }

        .brand-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: #FFFFFF;
            font-weight: 700;
            font-size: 0.73rem;
            padding: 4px 12px;
            border-radius: 20px;
        }

        .tier-status-badge {
            display: inline-block;
            background: rgba(255, 199, 44, 0.25);
            border: 1px solid var(--kz-gold);
            color: var(--kz-gold);
            font-weight: 800;
            font-size: 0.72rem;
            padding: 4px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            text-decoration: none;
        }

        h1 {
            font-size: 1.35rem;
            font-weight: 900;
            line-height: 1.2;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #FFFFFF;
            max-width: 600px;
            margin: 0 auto;
            text-shadow: 0 2px 10px rgba(0, 80, 120, 0.2);
        }

        .subtitle {
            font-size: 0.78rem;
            margin-top: 5px;
            font-weight: 800;
            letter-spacing: 0.6px;
            color: var(--kz-gold);
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
        }

        /* Шкала прогресса прослушанных выпусков */
        .progress-widget {
            width: 100%;
            max-width: 520px;
            background: rgba(15, 23, 42, 0.26);
            border: 1px solid rgba(255, 255, 255, 0.28);
            border-radius: 16px;
            padding: 10px 14px;
            margin: 12px auto 0 auto;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .pw-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.73rem;
            font-weight: 800;
            color: #FFFFFF;
            margin-bottom: 6px;
        }

        .pw-bar-bg {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.22);
            border-radius: 10px;
            overflow: hidden;
        }

        .pw-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--kz-gold) 0%, #34D399 100%);
            border-radius: 10px;
            transition: width 0.35s ease;
        }

        /* 2. Основной контейнер */
        main {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
            max-width: 780px;
            margin: 0 auto;
            padding: 18px 14px;
            flex-grow: 1;
        }

        /* Панель фильтрации плейлиста: Все (8) | Қазақша (4) | Русский (4) */
        .filter-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            background: #FFFFFF;
            padding: 6px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 12px rgba(0, 119, 163, 0.04);
        }

        .filter-btn {
            border: none;
            background: #F1F5F9;
            color: var(--text-muted);
            font-weight: 800;
            font-size: 0.76rem;
            padding: 10px 8px;
            border-radius: 11px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, var(--kz-blue) 0%, var(--kz-blue-dark) 100%);
            color: #FFFFFF;
            box-shadow: 0 3px 10px rgba(0, 161, 222, 0.25);
        }

        /* Заголовок языкового блока плейлиста */
        .playlist-section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 6px;
            padding: 4px 6px;
        }

        .psh-title {
            font-size: 0.92rem;
            font-weight: 900;
            color: var(--kz-blue-dark);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .psh-badge {
            font-size: 0.68rem;
            font-weight: 800;
            background: var(--green-light);
            color: var(--green-dark);
            border: 1px solid #86EFAC;
            padding: 3px 9px;
            border-radius: 10px;
        }

        /* Карточки выпусков плейлиста */
        .track-group {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .trainer-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, #FFFFFF 0%, #F4FAFF 68%, #EBF6FE 100%);
            border-radius: 16px;
            padding: 14px 16px;
            text-decoration: none;
            color: var(--text-dark);
            transition: all 0.2s ease;
            box-shadow: 0 3px 10px rgba(0, 119, 163, 0.05);
            position: relative;
            overflow: hidden;
            border: 1px solid #CBE7F9;
            width: 100%;
            text-align: left;
            cursor: pointer;
        }

        .trainer-card:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(0, 161, 222, 0.12);
            border-color: #7DD3FC;
        }

        .trainer-card::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 6px;
            background: linear-gradient(180deg, var(--kz-blue) 0%, var(--kz-blue-dark) 100%);
        }

        /* Бесплатные выпуски (№1 KZ и №1 RU) выделены зеленым акцентом */
        .track-group.free-track .trainer-card,
        .track-group.completed-track .trainer-card {
            background: linear-gradient(135deg, #FFFFFF 0%, #F0FDF4 65%, #DCFCE7 100%);
            border-color: #86EFAC;
        }

        .track-group.free-track .trainer-card::before,
        .track-group.completed-track .trainer-card::before {
            background: linear-gradient(180deg, #10B981 0%, #059669 100%);
        }

        .card-content {
            display: flex;
            align-items: center;
            gap: 13px;
            min-width: 0;
        }

        .card-icon {
            width: 46px;
            height: 46px;
            background: linear-gradient(135deg, #FFFFFF 0%, #E0F2FE 100%);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            flex-shrink: 0;
            border: 1px solid rgba(0, 161, 222, 0.22);
        }

        .track-group.free-track .card-icon,
        .track-group.completed-track .card-icon {
            background: linear-gradient(135deg, #FFFFFF 0%, #D1FAE5 100%);
            border-color: rgba(16, 185, 129, 0.3);
        }

        .card-text {
            min-width: 0;
        }

        .card-text h2 {
            font-size: 0.92rem;
            font-weight: 800;
            margin-bottom: 3px;
            color: var(--text-dark);
            line-height: 1.25;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .card-text p {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.35;
            font-weight: 600;
        }

        .words-preview-Line {
            font-size: 0.74rem;
            color: var(--kz-blue-dark);
            font-weight: 700;
            margin-top: 4px;
        }

        .track-pill {
            display: inline-block;
            background: rgba(0, 161, 222, 0.12);
            color: var(--kz-blue-dark);
            font-size: 0.64rem;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 6px;
            text-transform: uppercase;
        }

        .access-pill {
            display: inline-block;
            font-size: 0.64rem;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 8px;
            text-transform: uppercase;
            background: var(--kz-gold-light);
            color: #B45309;
            border: 1px solid rgba(217, 160, 0, 0.35);
        }

        .access-pill.free {
            background: var(--green-light);
            color: var(--green-dark);
            border-color: #86EFAC;
        }

        .done-pill {
            display: none;
            background: var(--green-light);
            color: var(--green-dark);
            border: 1px solid #86EFAC;
            font-size: 0.62rem;
            font-weight: 800;
            padding: 1px 6px;
            border-radius: 6px;
        }

        .track-group.completed-track .done-pill {
            display: inline-block;
        }

        .arrow-icon {
            width: 18px;
            height: 18px;
            fill: var(--kz-blue-dark);
            flex-shrink: 0;
            margin-left: 8px;
            transition: transform 0.25s ease;
        }

        /* Выпадающая панель с плеером Vimeo и карточками 5 слов */
        .track-group.open .trainer-card {
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0;
            border-bottom-color: transparent;
            background: linear-gradient(135deg, #EBF8FC 0%, #D6F1FA 100%);
        }

        .track-group.open .arrow-icon {
            transform: rotate(90deg);
        }

        .track-dropdown {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.22s ease;
            opacity: 0;
            background: var(--card-bg);
            border-left: 1px solid #CBE7F9;
            border-right: 1px solid #CBE7F9;
            border-bottom: 1px solid #CBE7F9;
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            position: relative;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.03);
        }

        .track-dropdown::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 6px;
            background: var(--kz-blue);
        }

        .track-group.open .track-dropdown {
            max-height: 1600px;
            opacity: 1;
        }

        .dropdown-inner {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 14px 16px 16px 20px;
            border-top: 1px dashed var(--border-color);
        }

        /* Плеер Vimeo 16:9 и блок Paywall для закрытых выпусков */
        .video-embed-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #0F172A;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .video-embed-box iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        .video-embed-box.locked {
            aspect-ratio: auto;
            min-height: 210px;
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
        }

        .video-paywall {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 460px;
            gap: 10px;
            color: #FFFFFF;
        }

        .paywall-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 199, 44, 0.18);
            border: 1px solid rgba(255, 199, 44, 0.45);
            color: var(--kz-gold);
            font-size: 0.7rem;
            font-weight: 800;
            padding: 4px 12px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .paywall-title {
            font-size: 0.94rem;
            font-weight: 800;
            color: #FFFFFF;
            line-height: 1.3;
        }

        .paywall-desc {
            font-size: 0.76rem;
            font-weight: 600;
            color: #CBD5E1;
            line-height: 1.45;
        }

        .paywall-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-top: 4px;
        }

        .paywall-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 9px 14px;
            border-radius: 12px;
            font-size: 0.76rem;
            font-weight: 800;
            text-decoration: none;
            flex: 1 1 165px;
        }

        .paywall-btn.tarifs {
            background: var(--kz-gold);
            color: var(--text-dark);
            border: 1px solid var(--kz-gold-dark);
        }

        .paywall-btn.contact {
            background: rgba(0, 161, 222, 0.22);
            color: #FFFFFF;
            border: 1px solid rgba(0, 161, 222, 0.55);
        }

        .paywall-login-link {
            font-size: 0.72rem;
            font-weight: 700;
            color: #94A3B8;
            text-decoration: underline;
            margin-top: 2px;
        }

        /* Шпаргалка по 5 терминам внутри выпуска */
        .terms-cheat-box {
            background: #F8FAFC;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .tc-header {
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--kz-blue-dark);
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 2px;
        }

        .tc-row {
            background: #FFFFFF;
            border: 1px solid var(--border-color);
            border-radius: 9px;
            padding: 7px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 0.8rem;
        }

        .tc-en {
            font-weight: 800;
            color: var(--text-dark);
        }

        .tc-tr {
            color: var(--text-muted);
            font-weight: 600;
        }

        .speak-mini-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1px solid rgba(0, 161, 222, 0.3);
            background: var(--kz-blue-light);
            color: var(--kz-blue-dark);
            cursor: pointer;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.76rem;
        }

        .mark-done-btn {
            background: #FFFFFF;
            border: 1px dashed var(--border-color);
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 800;
            padding: 9px 12px;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s ease;
        }

        .track-group.completed-track .mark-done-btn {
            background: var(--green-light);
            border-color: var(--green-accent);
            color: var(--green-dark);
        }

        /* 3. Подвал */
        footer {
            text-align: center;
            padding: 12px 16px 26px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .instagram-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--kz-blue-dark);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.82rem;
            padding: 10px 20px;
            border-radius: 22px;
            background: var(--card-bg);
            border: 1px solid rgba(0, 161, 222, 0.25);
            box-shadow: 0 4px 12px rgba(0, 119, 163, 0.05);
        }

        @media (max-width: 520px) {
            h1 { font-size: 1.18rem; }
            .filter-btn { font-size: 0.7rem; padding: 9px 4px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-top-bar">
            <a href="https://kazdoctors.com" class="back-btn">⬅️ На главную / Басты бетке</a>
            <a href="https://kazdoctors.com/tarifs" id="tierStatusBadge" class="tier-status-badge">Тариф: FREE</a>
        </div>

        <div class="header-badges">
            <div class="brand-badge">🎧 @doctors.speak • Audio & Video Playlist</div>
        </div>
        <h1>Аудио-тренажер медицинских терминов</h1>
        <p class="subtitle">Слушайте в дороге или дома • Қазақша (1–4) & Русский (5–8)</p>

        <!-- Трекер прослушанных выпусков -->
        <div class="progress-widget">
            <div class="pw-top-row">
                <span>🎧 Прослушано выпусков:</span>
                <span id="progressCountText" style="color:var(--kz-gold);">0 / 8 (0%)</span>
            </div>
            <div class="pw-bar-bg">
                <div class="pw-bar-fill" id="progressBarFill"></div>
            </div>
        </div>
    </header>

    <main>

        <!-- Фильтр плейлиста по языку -->
        <div class="filter-bar">
            <button type="button" class="filter-btn active" id="fBtnAll" onclick="setPlaylistFilter('all')">Все выпуски (8)</button>
            <button type="button" class="filter-btn" id="fBtnKz" onclick="setPlaylistFilter('kz')">🇰🇿 Қазақша (1–4)</button>
            <button type="button" class="filter-btn" id="fBtnRu" onclick="setPlaylistFilter('ru')">🇷🇺 Русский (5–8)</button>
        </div>

        <!-- Контейнер плейлиста (генерируется автоматически) -->
        <div id="playlistRoot" style="display:flex; flex-direction:column; gap:12px;"></div>

    </main>

    <footer>
        <a href="https://instagram.com/doctors.speak" target="_blank" rel="noopener noreferrer" class="instagram-link">
            <span>📸 Instagram @doctors.speak</span>
        </a>
    </footer>

    <script>
        // =========================================================================
        // 1. ВСТАВЬТЕ СЮДА ССЫЛКИ ИЛИ IFRAME-КОДЫ ВАШИХ 8 РОЛИКОВ С VIMEO
        // Поддерживается как полный код <iframe src="...">, так и ссылки вида:
        // "https://player.vimeo.com/video/123456789?h=abcdef123" или "https://vimeo.com/123456789/abcdef123"
        // =========================================================================
        const VIMEO_PLAYLIST_LINKS = {
            // --- ПЕРВЫЕ 4 ВИДЕО: НА КАЗАХСКОМ ЯЗЫКЕ ---
            kz1: "https://player.vimeo.com/video/1243084760", // 🔓 БЕСПЛАТНО (Открыто всем)
            kz2: "https://player.vimeo.com/video/1243084892", // 🔒 Только STANDARD и выше
            kz3: "https://player.vimeo.com/video/1243084620", // 🔒 Только STANDARD и выше
            kz4: "https://player.vimeo.com/video/1243084618", // 🔒 Только STANDARD и выше

            // --- СЛЕДУЮЩИЕ 4 ВИДЕО: НА РУССКОМ ЯЗЫКЕ ---
            ru1: "https://player.vimeo.com/video/1243084732", // 🔓 БЕСПЛАТНО (Открыто всем)
            ru2: "https://player.vimeo.com/video/1243084894", // 🔒 Только STANDARD и выше
            ru3: "https://player.vimeo.com/video/1243084621", // 🔒 Только STANDARD и выше

        // Функция автоматического распознавания скрытых (unlisted) ссылок и iframe-кодов Vimeo
        function normalizeVimeoEmbedUrl(rawInput) {
            if (!rawInput) return "";
            let str = rawInput.trim();

            if (str.includes("<iframe")) {
                const match = str.match(/src=["']([^"']+)["']/i);
                if (match && match[1]) {
                    str = match[1].replace(/&amp;/g, "&");
                }
            }

            const unlistedMatch = str.match(/vimeo\.com\/(\d+)\/([a-zA-Z0-9]+)/);
            if (unlistedMatch && !str.includes("player.vimeo.com")) {
                return `https://player.vimeo.com/video/${unlistedMatch[1]}?h=${unlistedMatch[2]}&badge=0&autopause=0&player_id=0&app_id=58479`;
            }

            const simpleMatch = str.match(/^https?:\/\/(?:www\.)?vimeo\.com\/(\d+)/);
            if (simpleMatch && !str.includes("player.vimeo.com")) {
                return `https://player.vimeo.com/video/${simpleMatch[1]}?badge=0&autopause=0&player_id=0&app_id=58479`;
            }

            return str;
        }

            if (!session || !session.user) return "none";
            const user = session.user;
            const userEmail = (user.email || "").toLowerCase().trim();

            try {
                let { data: profile } = await supabaseClient
                    .from('profiles')
                    .select('tier, subscription_expires_at')
                    .eq('id', user.id)
                    .maybeSingle();

                if (!profile && userEmail) {

                    profile = resByEmail.data;

                if (!profile || !profile.subscription_expires_at) return "none";
                const expiresAt = new Date(profile.subscription_expires_at);
                if (isNaN(expiresAt.getTime()) || new Date() > expiresAt) return "none";

                const dbTier = (profile.tier || "standard").toLowerCase().trim();
                return TIER_LEVELS[dbTier] !== undefined ? dbTier : "none";

            const isOpen = currentGroup.classList.contains('open');

            // Закрываем другие открытые выпуски и останавливаем их плееры
            document.querySelectorAll('.track-group.open').forEach(group => {
                group.classList.remove('open');

                if (iframe && iframe.getAttribute('src')) {
                    iframe.removeAttribute('src');
                }
            });

            if (!isOpen) {
                currentGroup.classList.add('open');
                if (isUnlocked) {
                    const iframe = currentGroup.querySelector('iframe');
                    if (iframe && iframe.dataset.src && !iframe.getAttribute('src')) {
                        iframe.setAttribute('src', iframe.dataset.src);
                    }
                }
            }

        // Озвучка отдельного термина через Web Speech API

            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(word);
            u.lang = 'en-US';
            u.rate = 0.9;
            window.speechSynthesis.speak(u);
        }

        // Сохранение прогресса прослушанных выпусков

                return [];

        function toggleTrackCompleted(trackId) {
            let list = getCompletedTracks();
            if (list.includes(trackId)) {
                list = list.filter(id => id !== trackId);
            } else {
                list.push(trackId);
            }
            localStorage.setItem('ds_completed_audio_tracks', JSON.stringify(list));
            renderPlaylist();
        }
