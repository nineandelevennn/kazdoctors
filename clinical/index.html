<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Medical English Trainer - @doctors.speak</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        kazakh: {
                            blue: '#00AFCA',
                            darkblue: '#008399',
                            lightblue: '#33C0D6',
                            gold: '#FFC72C',
                            darkgold: '#D9A300',
                            lightgold: '#FFE07D'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom scrollbar reset & touch optimizations */
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #009BB3 0%, #007A8F 50%, #005F70 100%);
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
        }

        /* Subtle Kazakh Sun Ornament Pattern Background */
        .kazakh-bg-pattern {
            background-color: #00AFCA;
            background-image: radial-gradient(#FFC72C 0.75px, transparent 0.75px), radial-gradient(#FFC72C 0.75px, #00AFCA 0.75px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            background-opacity: 0.15;
        }

        .gold-gradient-text {
            background: linear-gradient(180deg, #FFE885 0%, #FFC72C 60%, #D9A300 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gold-border-glow {
            box-shadow: 0 0 15px rgba(255, 199, 44, 0.3);
        }

        @keyframes pulse-success {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .animate-success {
            animation: pulse-success 0.3s ease-in-out;
        }
    </style>
</head>

<body class="text-slate-800 flex flex-col justify-between h-[100dvh] w-screen overflow-hidden p-2 sm:p-4">

    <!-- PASSWORD MODAL OVERLAY -->
    <div id="passwordModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-md">
        <div class="bg-white rounded-3xl shadow-2xl border-2 border-kazakh-gold w-full max-w-sm p-6 flex flex-col items-center text-center relative overflow-hidden">
            <!-- Decorative Flag Bar -->
            <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-kazakh-blue via-kazakh-gold to-kazakh-blue"></div>
            
            <div class="w-16 h-16 rounded-full bg-kazakh-blue/10 flex items-center justify-center mb-3 mt-2 text-kazakh-blue">
                <i class="fa-solid fa-user-doctor text-3xl text-kazakh-blue"></i>
            </div>

            <span class="text-xs font-bold uppercase tracking-wider text-kazakh-darkblue bg-kazakh-blue/10 px-3 py-1 rounded-full mb-1">
                @doctors.speak
            </span>
            <h2 class="text-xl font-extrabold text-slate-800 mb-1">Доступ к тренажеру</h2>
            <p class="text-xs text-slate-500 mb-5">Введите пароль доступа к материалам курса</p>

            <form id="passwordForm" onsubmit="handlePasswordSubmit(event)" class="w-full flex flex-col gap-3">
                <div class="relative w-full">
                    <input type="password" id="passwordInput" placeholder="Введите пароль..." 
                        class="w-full px-4 py-3 text-center text-lg font-semibold border-2 border-slate-200 rounded-2xl focus:border-kazakh-blue focus:outline-none transition-all"
                        autocomplete="off" required>
                </div>
                
                <div id="passwordError" class="hidden text-xs font-semibold text-rose-500 flex items-center justify-center gap-1">
                    <i class="fa-solid fa-circle-exclamation"></i> Неверный пароль. Попробуйте еще раз!
                </div>

                <button type="submit" class="w-full py-3.5 px-6 bg-gradient-to-r from-kazakh-gold to-kazakh-darkgold text-slate-900 font-extrabold text-base rounded-2xl shadow-lg hover:brightness-105 active:scale-95 transition-all flex items-center justify-center gap-2">
                    <span>Войти в тренажер</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN SCREEN CONTAINER (FITS 100vh) -->
    <main class="w-full max-w-md mx-auto flex-1 flex flex-col justify-between h-full gap-2">

        <!-- BRANDING HEADER (Prominently visible in mobile screenshots) -->
        <header class="bg-slate-900/60 backdrop-blur-md rounded-2xl p-2.5 px-3 border border-kazakh-gold/40 flex items-center justify-between shadow-lg shrink-0">
            <div class="flex items-center gap-2.5">
                <!-- Kazakh Sun Symbol Badge -->
                <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-kazakh-gold to-amber-500 flex items-center justify-center text-slate-900 font-bold shadow-md shrink-0">
                    <i class="fa-solid fa-caduceus text-lg"></i>
                </div>
                <div class="flex flex-col">
                    <div class="flex items-center gap-1.5">
                        <span class="text-base font-black tracking-tight text-white">
                            @doctors.speak
                        </span>
                        <span class="bg-kazakh-gold text-slate-950 text-[10px] font-black px-1.5 py-0.5 rounded-md uppercase">PRO</span>
                    </div>
                    <span class="text-[10px] font-medium text-kazakh-lightgold">
                        Medical Terminology Simulator
                    </span>
                </div>
            </div>

            <!-- Flag Ornament Icon -->
            <div class="text-kazakh-gold flex items-center justify-center text-xl pr-1">
                <i class="fa-solid fa-sun animate-spin-slow"></i>
            </div>
        </header>

        <!-- STATS BAR -->
        <section class="grid grid-cols-3 gap-2 shrink-0">
            <div class="bg-white/95 backdrop-blur-sm rounded-xl p-2 text-center shadow-md border border-slate-100 flex flex-col justify-center">
                <span class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Пройдено</span>
                <span id="statTotal" class="text-lg font-black text-slate-800">0</span>
            </div>

            <div class="bg-white/95 backdrop-blur-sm rounded-xl p-2 text-center shadow-md border border-slate-100 flex flex-col justify-center">
                <span class="text-[10px] uppercase font-bold text-emerald-600 tracking-wider">Верно</span>
                <span id="statCorrect" class="text-lg font-black text-emerald-600">0</span>
            </div>

            <div class="bg-white/95 backdrop-blur-sm rounded-xl p-2 text-center shadow-md border border-slate-100 flex flex-col justify-center">
                <span class="text-[10px] uppercase font-bold text-kazakh-darkblue tracking-wider">Точность</span>
                <span id="statAccuracy" class="text-lg font-black text-kazakh-darkblue">0%</span>
            </div>
        </section>

        <!-- MODE SELECTOR TABS -->
        <section class="bg-slate-900/40 p-1 rounded-2xl border border-white/10 shrink-0">
            <div class="grid grid-cols-4 gap-1 text-center">
                <button onclick="setMode('eng_kaz')" id="mode-eng_kaz" class="mode-btn py-1.5 px-1 rounded-xl text-xs font-bold transition-all bg-kazakh-gold text-slate-950 shadow-md">
                    Eng ➔ Kaz
                </button>
                <button onclick="setMode('eng_rus')" id="mode-eng_rus" class="mode-btn py-1.5 px-1 rounded-xl text-xs font-bold transition-all text-white/80 hover:bg-white/10">
                    Eng ➔ Rus
                </button>
                <button onclick="setMode('kaz_eng')" id="mode-kaz_eng" class="mode-btn py-1.5 px-1 rounded-xl text-xs font-bold transition-all text-white/80 hover:bg-white/10">
                    Kaz ➔ Eng
                </button>
                <button onclick="setMode('rus_eng')" id="mode-rus_eng" class="mode-btn py-1.5 px-1 rounded-xl text-xs font-bold transition-all text-white/80 hover:bg-white/10">
                    Rus ➔ Eng
                </button>
            </div>
        </section>

        <!-- QUIZ CARD -->
        <section class="bg-white rounded-3xl p-4 shadow-2xl border-2 border-kazakh-gold/30 flex flex-col justify-between flex-1 min-h-0 relative overflow-hidden">
            <!-- Top Card Header / Category Badge -->
            <div class="flex items-center justify-between mb-2 shrink-0">
                <span id="categoryBadge" class="text-[11px] font-extrabold uppercase tracking-wider text-kazakh-darkblue bg-kazakh-blue/10 px-2.5 py-1 rounded-lg">
                    Respiratory system
                </span>
                <span id="modeLabelHint" class="text-[10px] font-bold text-slate-400 uppercase">
                    Выберите перевод
                </span>
            </div>

            <!-- Target Question Term -->
            <div class="flex-1 flex flex-col items-center justify-center text-center py-2 my-auto">
                <h1 id="questionTerm" class="text-2xl sm:text-3xl font-black text-slate-800 tracking-tight leading-tight transition-all">
                    Chest tightness
                </h1>
                <p id="phoneticText" class="text-xs font-medium text-slate-400 mt-1 italic">
                    /tʃest 'taɪtnəs/
                </p>
            </div>

            <!-- 4 Multiple Choice Options Grid -->
            <div id="optionsGrid" class="grid grid-cols-1 gap-2 shrink-0 w-full">
                <!-- Option buttons generated dynamically in JS -->
            </div>
        </section>

        <!-- ACTION FOOTER / NEXT BUTTON -->
        <footer class="shrink-0 pb-1">
            <button id="nextBtn" onclick="nextQuestion()" disabled
                class="w-full py-3 px-6 bg-gradient-to-r from-kazakh-gold via-amber-400 to-kazakh-gold text-slate-950 font-black text-base rounded-2xl shadow-xl transition-all flex items-center justify-center gap-2 opacity-50 cursor-not-allowed">
                <span>КЕЛЕСІ / СЛЕДУЮЩЕЕ</span>
                <i class="fa-solid fa-arrow-right-long text-lg"></i>
            </button>
        </footer>

    </main>

            { eng: "Violaceous", kaz: "Күлгін түсті", rus: "Фиолетовый", phone: "/vaɪə'leɪʃəs/", cat: "Allergy/immunology" },
            { eng: "Visible", kaz: "Көрінетін", rus: "Видимый", phone: "/'vɪzəbəl/", cat: "Allergy/immunology" },
            { eng: "Fissure", kaz: "Жарық", rus: "Трещина", phone: "/'fɪʃər/", cat: "Allergy/immunology" },
            { eng: "Hives", kaz: "Есекжем", rus: "Крапивница", phone: "/haɪvz/", cat: "Allergy/immunology" },
            { eng: "Angioedema", kaz: "Ангиоісіну", rus: "Ангиоотёк", phone: "/ændʒioʊɪ'diːmə/", cat: "Allergy/immunology" },
            { eng: "Hypersensitivity", kaz: "Жоғары сезімталдық", rus: "Гиперчувствительность", phone: "/haɪpərsensɪ'tɪvəti/", cat: "Allergy/immunology" },
            { eng: "Delayed", kaz: "Кешігу", rus: "Замедленный", phone: "/dɪ'leɪd/", cat: "Allergy/immunology" }
        ];

        // STATE VARIABLES
        let currentMode = 'eng_kaz'; // 'eng_kaz', 'eng_rus', 'kaz_eng', 'rus_eng'
        let currentItem = null;
        let currentCorrectAnswer = "";
        let isAnswered = false;
        
        let statTotal = 0;
        let statCorrect = 0;

        // PASSWORD VERIFICATION LOGIC
        function handlePasswordSubmit(event) {
            event.preventDefault();
            const input = document.getElementById('passwordInput').value.trim();
            const errorEl = document.getElementById('passwordError');

            if (input === CORRECT_PASSWORD) {
                document.getElementById('passwordModal').classList.add('hidden');
                initQuiz();
            } else {
                errorEl.classList.remove('hidden');
                document.getElementById('passwordInput').value = '';
                document.getElementById('passwordInput').focus();
            }
        }

        // MODE CHANGE HANDLER
        function setMode(mode) {
            currentMode = mode;
            
            // Update active button styles
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.className = "mode-btn py-1.5 px-1 rounded-xl text-xs font-bold transition-all text-white/80 hover:bg-white/10";
            });
            const activeBtn = document.getElementById(`mode-${mode}`);
            if (activeBtn) {
                activeBtn.className = "mode-btn py-1.5 px-1 rounded-xl text-xs font-bold transition-all bg-kazakh-gold text-slate-950 shadow-md";
            }

            // Reload question with new mode
            loadNextQuestion();
        }

        // QUIZ INITIALIZATION & RANDOMIZER
        function initQuiz() {
            statTotal = 0;
            statCorrect = 0;
            updateStats();
            loadNextQuestion();
        }

        function loadNextQuestion() {
            isAnswered = false;

            // Pick random vocabulary item
            const randomIndex = Math.floor(Math.random() * VOCABULARY.length);
            currentItem = VOCABULARY[randomIndex];

            // Setup Question & Correct Answer based on mode
            let questionText = "";
            let phonetic = "";
            let category = currentItem.cat || "General Medical";

            if (currentMode === 'eng_kaz') {
                questionText = currentItem.eng;
                phonetic = currentItem.phone || "";
                currentCorrectAnswer = currentItem.kaz;
                document.getElementById('modeLabelHint').innerText = "Аудармасын таңдаңыз (Қаз)";
            } else if (currentMode === 'eng_rus') {
                questionText = currentItem.eng;
                phonetic = currentItem.phone || "";
                currentCorrectAnswer = currentItem.rus;
                document.getElementById('modeLabelHint').innerText = "Выберите перевод (Рус)";
            } else if (currentMode === 'kaz_eng') {
                questionText = currentItem.kaz;
                phonetic = "Қазақша термин";
                currentCorrectAnswer = currentItem.eng;
                document.getElementById('modeLabelHint').innerText = "Select English Term";
            } else if (currentMode === 'rus_eng') {
                questionText = currentItem.rus;
                phonetic = "Русский термин";
                currentCorrectAnswer = currentItem.eng;
                document.getElementById('modeLabelHint').innerText = "Select English Term";
            }

            // Update DOM Elements
            document.getElementById('questionTerm').innerText = questionText;
            document.getElementById('phoneticText').innerText = phonetic;
            document.getElementById('categoryBadge').innerText = category;

            // Generate 4 Answer Choices (1 Correct, 3 Wrong)
            const choices = generateChoices(currentCorrectAnswer);

            // Render Choices Grid
            const optionsGrid = document.getElementById('optionsGrid');
            optionsGrid.innerHTML = '';

            choices.forEach((choice, idx) => {
                const btn = document.createElement('button');
                btn.className = `option-btn w-full p-3 sm:p-3.5 text-left text-sm sm:text-base font-bold text-slate-700 bg-slate-100 hover:bg-slate-200 border-2 border-slate-200 rounded-2xl transition-all flex items-center justify-between group active:scale-[0.99]`;
                btn.onclick = () => selectOption(choice, btn);
                
                btn.innerHTML = `
                    <span class="flex-1 pr-2">${choice}</span>
                    <span class="w-6 h-6 rounded-full border-2 border-slate-300 flex items-center justify-center text-xs font-bold text-slate-400 group-hover:border-kazakh-blue group-hover:text-kazakh-blue shrink-0">
                        ${String.fromCharCode(65 + idx)}
                    </span>
                `;
                optionsGrid.appendChild(btn);
            });

            // Disable Next Button until answer selected
            const nextBtn = document.getElementById('nextBtn');
            nextBtn.disabled = true;
            nextBtn.className = "w-full py-3 px-6 bg-gradient-to-r from-kazakh-gold via-amber-400 to-kazakh-gold text-slate-950 font-black text-base rounded-2xl shadow-xl transition-all flex items-center justify-center gap-2 opacity-50 cursor-not-allowed";
        }

        // GENERATE DISTRACTORS
        function generateChoices(correct) {
            const choices = [correct];
            const keyToPull = (currentMode === 'eng_kaz') ? 'kaz' :
                              (currentMode === 'eng_rus') ? 'rus' : 'eng';

            // Extract all candidate wrong answers
            const candidates = VOCABULARY
                .map(item => item[keyToPull])
                .filter(val => val && val !== correct);

            // Shuffle candidates
            shuffleArray(candidates);

            // Pick first 3 distinct wrong answers
            for (let i = 0; i < candidates.length && choices.length < 4; i++) {
                if (!choices.includes(candidates[i])) {
                    choices.push(candidates[i]);
                }
            }

            // Shuffle final 4 options
            shuffleArray(choices);
            return choices;
        }

        // FISHER-YATES SHUFFLE
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // OPTION SELECTION & FEEDBACK LOGIC
        function selectOption(selectedChoice, selectedBtn) {
            if (isAnswered) return;
            isAnswered = true;

            statTotal++;
            const allBtns = document.querySelectorAll('.option-btn');

            if (selectedChoice === currentCorrectAnswer) {
                // Correct Answer
                statCorrect++;
                selectedBtn.className = "option-btn w-full p-3 sm:p-3.5 text-left text-sm sm:text-base font-bold text-white bg-emerald-500 border-2 border-emerald-600 rounded-2xl shadow-lg animate-success flex items-center justify-between";
                selectedBtn.querySelector('span:last-child').innerHTML = `<i class="fa-solid fa-check text-white"></i>`;
                selectedBtn.querySelector('span:last-child').className = "w-6 h-6 rounded-full bg-emerald-600 flex items-center justify-center shrink-0";
            } else {
                // Wrong Answer selected
                selectedBtn.className = "option-btn w-full p-3 sm:p-3.5 text-left text-sm sm:text-base font-bold text-white bg-rose-500 border-2 border-rose-600 rounded-2xl shadow-lg flex items-center justify-between";
                selectedBtn.querySelector('span:last-child').innerHTML = `<i class="fa-solid fa-xmark text-white"></i>`;
                selectedBtn.querySelector('span:last-child').className = "w-6 h-6 rounded-full bg-rose-600 flex items-center justify-center shrink-0";

                // Highlight correct option in green
                allBtns.forEach(btn => {
                    if (btn.innerText.includes(currentCorrectAnswer)) {
                        btn.className = "option-btn w-full p-3 sm:p-3.5 text-left text-sm sm:text-base font-bold text-white bg-emerald-500 border-2 border-emerald-600 rounded-2xl shadow-lg flex items-center justify-between animate-pulse";
                        btn.querySelector('span:last-child').innerHTML = `<i class="fa-solid fa-check text-white"></i>`;
                        btn.querySelector('span:last-child').className = "w-6 h-6 rounded-full bg-emerald-600 flex items-center justify-center shrink-0";
                    }
                });
            }

            // Disable all option buttons
            allBtns.forEach(btn => {
                btn.style.pointerEvents = 'none';
            });

            // Update stats
            updateStats();

            // Enable Next Button
            const nextBtn = document.getElementById('nextBtn');
            nextBtn.disabled = false;
            nextBtn.className = "w-full py-3 px-6 bg-gradient-to-r from-kazakh-gold via-amber-400 to-kazakh-gold text-slate-950 font-black text-base rounded-2xl shadow-xl transition-all flex items-center justify-center gap-2 hover:brightness-105 active:scale-98 cursor-pointer gold-border-glow";
        }

        // NEXT QUESTION TRIGGER
        function nextQuestion() {
            if (!isAnswered) return;
            loadNextQuestion();
        }

        // STATS COUNTER UPDATE
        function updateStats() {
            document.getElementById('statTotal').innerText = statTotal;
            document.getElementById('statCorrect').innerText = statCorrect;
            
            const accuracy = statTotal > 0 ? Math.round((statCorrect / statTotal) * 100) : 0;
            document.getElementById('statAccuracy').innerText = `${accuracy}%`;
        }

        // Focus password field on page load
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('passwordInput').focus();
        });
    </script>
