<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>@doctors.speak — Clinical Vocabulary Trainer</title>
  <style>
    :root {
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --accent: #f59e0b;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      --card-bg: rgba(255, 255, 255, 0.98);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --correct-bg: #dcfce7;
      --correct-border: #22c55e;
      --correct-text: #15803d;
      --wrong-bg: #ffe4e6;
      --wrong-border: #f43f5e;
      --wrong-text: #be123c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      height: 100vh;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      width: 280px;
      height: 280px;
      background: rgba(14, 165, 233, 0.25);
      filter: blur(90px);
      border-radius: 50%;
      top: -40px;
      left: -40px;
    }

    body::after {
      content: '';
      position: absolute;
      width: 280px;
      height: 280px;
      background: rgba(245, 158, 11, 0.15);
      filter: blur(90px);
      border-radius: 50%;
      bottom: -40px;
      right: -40px;
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      width: 100%;
      max-width: 420px;
      height: 100%;
      max-height: 700px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid #e2e8f0;
    }

    .home-btn {
      background: #f1f5f9;
      color: #334155;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.8rem;
      padding: 6px 12px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      border: 1px solid #e2e8f0;
    }

    .home-btn:hover {
      background: #e2e8f0;
    }

    .brand {
      font-weight: 800;
      font-size: 0.95rem;
      background: linear-gradient(135deg, #0284c7, #0d9488);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .mode-select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      font-weight: 600;
      color: #0f172a;
      background: #f8fafc;
      outline: none;
      font-size: 0.85rem;
      margin-top: 10px;
      cursor: pointer;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 8px;
    }

    .stat-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 8px 12px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .stat-val {
      font-weight: 700;
      font-size: 0.95rem;
      color: #0f172a;
    }

    .stat-val.correct {
      color: #16a34a;
    }

    .term-box {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      margin: 12px 0;
      background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
      border-radius: 16px;
      padding: 16px;
      border: 1px solid #e2e8f0;
    }

    .term-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 6px;
      word-break: break-word;
    }

    .term-sub {
      font-size: 0.85rem;
      color: #64748b;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    .option-btn {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      padding: 11px 14px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 600;
      color: #334155;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .option-btn:hover:not(:disabled) {
      border-color: #38bdf8;
      background: #f0f9ff;
    }

    .option-badge {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: #f1f5f9;
      color: #64748b;
      font-size: 0.75rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .option-btn.correct {
      background-color: var(--correct-bg) !important;
      border-color: var(--correct-border) !important;
      color: var(--correct-text) !important;
    }

    .option-btn.correct .option-badge {
      background: var(--correct-border);
      color: #fff;
    }

    .option-btn.wrong {
      background-color: var(--wrong-bg) !important;
      border-color: var(--wrong-border) !important;
      color: var(--wrong-text) !important;
    }

    .option-btn.wrong .option-badge {
      background: var(--wrong-border);
      color: #fff;
    }

    .next-btn {
      width: 100%;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #ffffff;
      border: none;
      padding: 13px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(217, 119, 6, 0.25);
      transition: all 0.2s ease;
      display: none;
    }

    .next-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>

        answerKey = 'eng';
      }

      document.getElementById('termText').textContent = questionText;
      document.getElementById('termSub').textContent = subText;

      let options = [correctAnswer];
      while (options.length < 4) {
        let rand = getRandomItem()[answerKey];
        if (!options.includes(rand)) {
          options.push(rand);
        }
      }
      options = shuffle(options);

      const grid = document.getElementById('optionsGrid');
      grid.innerHTML = '';

      const letters = ['A', 'B', 'C', 'D'];
      options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.dataset.val = opt;

        const badge = document.createElement('span');
        badge.className = 'option-badge';
        badge.textContent = letters[idx];

        const label = document.createElement('span');
        label.textContent = opt;

        btn.appendChild(badge);
        btn.appendChild(label);

        btn.onclick = () => selectOption(btn, opt === correctAnswer);
        grid.appendChild(btn);
      });
    }

    function selectOption(selectedBtn, isCorrect) {
      if (answered) return;
      answered = true;

      total++;
      if (isCorrect) {
        correct++;
        selectedBtn.classList.add('correct');
      } else {
        selectedBtn.classList.add('wrong');
        const mode = document.getElementById('modeSelect').value;
        let rightAns = (mode === 'eng-kaz') ? currentItem.kaz :
                       (mode === 'eng-rus') ? currentItem.rus : currentItem.eng;
        
        document.querySelectorAll('.option-btn').forEach(b => {
          if (b.dataset.val === rightAns) b.classList.add('correct');
        });
      }

      document.getElementById('totalCount').textContent = total;
      document.getElementById('correctCount').textContent = correct;
      document.getElementById('nextBtn').style.display = 'block';
    }
  </script>
</body>
</html>
