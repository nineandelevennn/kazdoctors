<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>@doctors.speak — Clinical Vocabulary Trainer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --kz-blue: #00A1DE;
      --kz-blue-dark: #0077A3;
      --kz-blue-light: #EBF8FC;
      --kz-gold: #FFC72C;
      --bg-main: #F2F5F8;
      --card-bg: #FFFFFF;
      --text-dark: #1E293B;
      --text-muted: #64748B;
      --border-color: #E2E8F0;
      --correct-bg: #E6F4EA;
      --correct-border: #34A853;
      --correct-text: #137333;
      --wrong-bg: #FCE8E6;
      --wrong-border: #EA4335;
      --wrong-text: #C5221F;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-main);
      color: var(--text-dark);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    /* Главный контейнер карточки */
    .card {
      position: relative;
      background: var(--card-bg);
      border-radius: 28px;
      width: 100%;
      max-width: 420px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }

    /* Яркая голубая шапка */
    .header {
      background: var(--kz-blue);
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .home-btn {
      background: rgba(255, 255, 255, 0.25);
      color: #FFFFFF;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 8px 16px;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      transition: background 0.2s ease;
    }

    .home-btn:active {
      background: rgba(255, 255, 255, 0.4);
    }

    .brand {
      background: rgba(255, 255, 255, 0.25);
      color: #FFFFFF;
      font-weight: 800;
      font-size: 0.8rem;
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      letter-spacing: 0.5px;
    }

    /* Содержимое карточки */
    .content {
      padding: 18px 20px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Выбор режима */
    .mode-select {
      width: 100%;
      padding: 9px 14px;
      border: 1px solid #D0E4EC;
      border-radius: 12px;
      font-weight: 700;
      color: var(--kz-blue-dark);
      background: var(--kz-blue-light);
      outline: none;
      font-size: 0.82rem;
      cursor: pointer;
      text-align: center;
    }

    /* Статистика */
    .stats-bar {
      background: #F8FAFC;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-dark);
    }

    .stat-val {
      font-weight: 800;
    }

    .stat-val.correct {
      color: #22C55E;
    }

    .stat-val.streak {
      color: #F59E0B;
    }

    /* Блок вопроса с желтой полоской слева */
    .term-box {
      position: relative;
      border: 1px solid #E2E8F0;
      border-radius: 20px;
      padding: 24px 18px;
      text-align: center;
      min-height: 150px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #FFFFFF;
      overflow: hidden;
    }

    .term-box::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 6px;
      background: var(--kz-gold);
    }

    .level-badge {
      display: inline-block;
      background: var(--kz-blue-light);
      color: var(--kz-blue-dark);
      font-size: 0.7rem;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 12px;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .term-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-dark);
      line-height: 1.35;
      word-break: break-word;
    }

    .term-sub {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 4px;
      font-weight: 600;
    }

    /* Сети вариантов ответов */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-dark);
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.02);
    }

    .option-btn:active:not(:disabled) {
      transform: scale(0.99);
      background: #F8FAFC;
    }

    .option-btn.correct {
      background-color: #FFFFFF !important;
      border-color: var(--correct-border) !important;
      color: var(--correct-text) !important;
    }

    .option-btn.wrong {
      background-color: #FFFFFF !important;
      border-color: var(--wrong-border) !important;
      color: var(--wrong-text) !important;
    }

    /* Блок пояснения / кнопки "Далее" (Зафиксирован по высоте, чтобы ничего не прыгало) */
    .explanation-box {
      min-height: 52px;
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 0.82rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-left: 5px solid var(--kz-blue);
      background: var(--kz-blue-light);
      color: var(--kz-blue-dark);
    }

    .explanation-box.correct-mode {
      border-left-color: var(--correct-border);
      background: var(--correct-bg);
      color: var(--correct-text);
    }

    .explanation-box.wrong-mode {
      border-left-color: var(--wrong-border);
      background: var(--wrong-bg);
      color: var(--wrong-text);
    }

    .next-action-btn {
      background: var(--kz-blue);
      color: #FFFFFF;
      border: none;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      margin-left: 10px;
      flex-shrink: 0;
      transition: background 0.2s ease;
    }

    .next-action-btn:active {
      background: var(--kz-blue-dark);
    }
  </style>
</head>

      { eng: "vaginal bleeding", kaz: "қынаптан қан кету", rus: "вагинальное кровотечение", pron: "/va-dzi-nal bli:din/ • вагинал блединг" },

      // Urology
      { eng: "dribbling", kaz: "таму", rus: "подтекание мочи", pron: "/dri-blin/ • дриблинг" },
      { eng: "firm", kaz: "қатты/тығыз", rus: "плотный", pron: "/f3:m/ • ферм" },
      { eng: "flank pain", kaz: "бүйір ауыруы", rus: "боль в боку", pron: "/flank pein/ • фланк пэйн" },
      { eng: "hesitancy", kaz: "зәр шығарудың қиындауы", rus: "задержка мочеиспускания", pron: "/he-zi-tən-si/ • хезитэнси" },
      { eng: "incontinence", kaz: "зәр ұстай алмау", rus: "недержание мочи", pron: "/in-kon-ti-nens/ • инконтиненс" },
      { eng: "nodular", kaz: "түйінді", rus: "узловой", pron: "/no-du-lar/ • нодуляр" },
      { eng: "retention", kaz: "зәр іркілуі, тоқтауы", rus: "задержка мочи", pron: "/ri-ten-shən/ • ритеншн" },
      { eng: "scrotal swelling", kaz: "ұма ісінуі", rus: "отёк мошонки", pron: "/skro-tal swe-lin/ • скротал свелинг" },
      { eng: "straining to urinate", kaz: "зәр шығаруда күшену", rus: "натуживание при мочеиспускании", pron: "/strein-in tu ju-ri-neit/ • стрейнинг" },
      { eng: "suprapubic pain", kaz: "қасаға үсті ауыруы", rus: "надлобковая боль", pron: "/su-pra-pyu-bik pein/ • супрапюбик пэйн" },
      { eng: "urgency", kaz: "зәр шығаруға мәжбүрлеу", rus: "императивный позыв к мочеиспусканию", pron: "/3:-dzen-si/ • эрдженси" },
      { eng: "urinary frequency", kaz: "жиі зәр шығару", rus: "частое мочеиспускание", pron: "/yu-ri-ne-ri fre-kwen-si/ • юринари фреквенси" },
      { eng: "voiding", kaz: "зәр шығару", rus: "мочеиспускание", pron: "/voi-din/ • войдинг" }
    ];

    let total = 0;
    let correct = 0;
    let streak = 0;
    let currentItem = null;
    let answered = false;

    function getRandomItem() {
      return vocabulary[Math.floor(Math.random() * vocabulary.length)];
    }

    function shuffle(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function resetAndNext() {
      nextQuestion();
    }

    function nextQuestion() {
      answered = false;
      
      const expBox = document.getElementById('explanationBox');
      expBox.className = 'explanation-box';
      document.getElementById('explanationText').textContent = '💡 Choose the correct answer!';
      document.getElementById('nextBtn').style.display = 'none';

      const mode = document.getElementById('modeSelect').value;
      currentItem = getRandomItem();

      let questionText = "";
      let subText = "";
      let correctAnswer = "";
      let answerKey = "";

      if (mode === 'eng-kaz') {
        questionText = currentItem.eng;
        subText = currentItem.pron || "";
        correctAnswer = currentItem.kaz;
        answerKey = 'kaz';
      } else if (mode === 'eng-rus') {
        questionText = currentItem.eng;
        subText = currentItem.pron || "";
        correctAnswer = currentItem.rus;
        answerKey = 'rus';
      } else if (mode === 'kaz-eng') {
        questionText = currentItem.kaz;
        subText = "Қазақша ➔ English";
        correctAnswer = currentItem.eng;
        answerKey = 'eng';
      } else if (mode === 'rus-eng') {
        questionText = currentItem.rus;
        subText = "Русский ➔ English";
        correctAnswer = currentItem.eng;
        answerKey = 'eng';
      }

      document.getElementById('termText').textContent = questionText;
      document.getElementById('termSub').textContent = subText;

      let options = [correctAnswer];
      while (options.length < 3) {
        let rand = getRandomItem()[answerKey];
        if (!options.includes(rand)) {
          options.push(rand);
        }
      }
      options = shuffle(options);

      const grid = document.getElementById('optionsGrid');
      grid.innerHTML = '';

      const letters = ['A', 'B', 'C'];
      options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.dataset.val = opt;

        btn.textContent = `${letters[idx]}) ${opt}`;

        btn.onclick = () => selectOption(btn, opt === correctAnswer);
        grid.appendChild(btn);
      });
    }

    function selectOption(selectedBtn, isCorrect) {
      if (answered) return;
      answered = true;

      total++;
      const expBox = document.getElementById('explanationBox');
      const mode = document.getElementById('modeSelect').value;
      let rightAns = (mode === 'eng-kaz') ? currentItem.kaz :
                     (mode === 'eng-rus') ? currentItem.rus : currentItem.eng;

      if (isCorrect) {
        correct++;
        streak++;
        selectedBtn.classList.add('correct');
        expBox.className = 'explanation-box correct-mode';
        document.getElementById('explanationText').textContent = '🎉 Correct! Well done.';
      } else {
        streak = 0;
        selectedBtn.classList.add('wrong');
        expBox.className = 'explanation-box wrong-mode';
        document.getElementById('explanationText').textContent = `❌ Correct: ${rightAns}`;

        document.querySelectorAll('.option-btn').forEach(b => {
          if (b.dataset.val === rightAns) b.classList.add('correct');
        });
      }

      document.getElementById('totalCount').textContent = total;
      document.getElementById('correctCount').textContent = correct;
      document.getElementById('streakCount').textContent = streak + " 🔥";
      document.getElementById('nextBtn').style.display = 'inline-block';
    }
  </script>
</body>
</html>
