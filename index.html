<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Кто последний? — игра про медкомиссию · Doctors Speak</title>
<meta name="description" content="Соберите шесть печатей в обходной лист быстрее всех. Очереди, бабушки, «мне только спросить» и доктор на обеде.">
<link rel="icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-50:#EAF4FD; --sky-100:#CFE6FA; --sky-500:#2BA8F0; --sky-700:#0070BF; --sky-900:#0B4F8A;
    --sun-50:#FFF8E1; --sun-500:#FEC50C; --sun-600:#E0AC00; --sun-ink:#8A6A00;
    --bg:#F5F9FE; --subtle:#EDF3FB; --line:#DCE7F3; --line-2:#B4C6DA;
    --ink:#13243A; --ink-2:#33475E; --ink-3:#5A6B80;
    --ok:#1A7F5A; --ok-bg:#E8F5EF; --err:#B42318; --err-bg:#FDECEA;
    --font-ui:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --font-h:"Montserrat","Inter",system-ui,sans-serif;
    --ease:cubic-bezier(.2,.7,.2,1);
    --floor:70px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:var(--font-ui);color:var(--ink);background:#E9F0F7;display:flex;justify-content:center;overflow:hidden;
       -webkit-user-select:none;user-select:none}
  .app{width:100%;max-width:520px;height:100dvh;display:flex;flex-direction:column;position:relative;background:var(--bg)}

  /* ---------- верхняя панель ---------- */
  .top{background:#fff;border-bottom:1px solid var(--line);padding:10px 12px 10px;z-index:5}
  .top-row{display:flex;align-items:center;gap:10px}
  .clock{font-family:var(--font-h);font-weight:800;font-size:25px;color:var(--sky-900);font-variant-numeric:tabular-nums;min-width:82px;line-height:1.05}
  .clock small{display:block;font:500 11px var(--font-ui);color:var(--ink-3)}
  .nerves{flex:1}
  .nerves-label{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin-bottom:4px}
  .nerves-label b{color:var(--ink-2)}
  .bar{height:10px;border-radius:99px;background:var(--subtle);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#3BB273,#7BCB5B);transition:width .4s var(--ease)}
  .bar i.mid{background:linear-gradient(90deg,#F2B705,#FEC50C)}
  .bar i.low{background:linear-gradient(90deg,#D64535,#F06A4A)}
  .tbtn{border:1px solid var(--line);background:#fff;border-radius:10px;height:36px;min-width:40px;padding:0 8px;font:700 13px var(--font-ui);color:var(--sky-900);cursor:pointer}
  .stamps{display:flex;gap:6px;margin-top:9px}
  .stamp{flex:1;height:28px;border-radius:8px;border:1.5px dashed var(--line-2);display:flex;align-items:center;justify-content:center;color:var(--line-2)}
  .stamp svg{width:16px;height:16px}
  .stamp.got{border:1.5px solid var(--sky-700);background:var(--sky-50);color:var(--sky-700)}
  .stamp.pop{animation:pop .5s var(--ease)}
  @keyframes pop{40%{transform:scale(1.2)}}

  /* ---------- сцена ---------- */
  .scene{flex:1;min-height:280px;position:relative;overflow:hidden;touch-action:pan-y;cursor:grab}
  .world{position:absolute;left:0;bottom:0;height:380px;transform-origin:0 100%;will-change:transform}
  .wall{position:absolute;inset:0 0 var(--floor) 0;background:linear-gradient(180deg,#F7FAFD 0%,#EEF4FA 100%)}
  .panel{position:absolute;left:0;right:0;bottom:var(--floor);height:118px;background:#CFE2F2;border-top:6px solid #A9CAE6}
  .floor{position:absolute;left:0;right:0;bottom:0;height:var(--floor);
         background:repeating-linear-gradient(90deg,#D7DEE7 0 118px,#CDD5DF 118px 120px),#D7DEE7;border-top:7px solid #5D6F84}
  .floor::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(0,0,0,.04))}

  .door{position:absolute;bottom:calc(var(--floor) - 2px);width:92px;cursor:pointer;z-index:2}
  .plate{position:absolute;bottom:186px;left:-14px;right:-14px;background:#fff;border:1px solid var(--line-2);border-radius:6px;
         text-align:center;padding:3px 4px;font-size:11px;line-height:1.15;color:var(--ink-2);box-shadow:0 2px 0 rgba(0,0,0,.05)}
  .plate b{display:block;color:var(--sky-700);font:800 13px var(--font-h)}
  .frame{position:relative;height:178px;background:#7D93AA;border-radius:4px 4px 0 0}
  .inside{position:absolute;inset:5px 5px 0;background:linear-gradient(180deg,#2B3E52,#3E566F)}
  .leaf{position:absolute;inset:5px 5px 0;background:linear-gradient(180deg,#FBFDFF,#E6EEF6);border-radius:2px;
        transform-origin:left center;transition:transform .45s var(--ease);box-shadow:inset 0 0 0 1px #C9D6E3}
  .door.open .leaf{transform:perspective(500px) rotateY(-62deg)}
  .win{position:absolute;left:14px;right:14px;top:14px;height:44px;background:linear-gradient(135deg,#D6E8F6,#B9D5EC);border-radius:2px}
  .handle{position:absolute;right:9px;top:92px;width:12px;height:4px;border-radius:2px;background:#8A9BAE}
  .lamp{position:absolute;bottom:226px;left:50%;transform:translateX(-50%);font:700 8px var(--font-ui);letter-spacing:.08em;
        padding:3px 6px;border-radius:4px;background:#E3E9F0;color:#9AA9BA;white-space:nowrap;transition:all .3s}
  .door.busy .lamp{background:#E5484D;color:#fff;box-shadow:0 0 12px rgba(229,72,77,.55)}
  .sign{position:absolute;left:50%;top:-112px;transform:translateX(-50%) rotate(-4deg);background:#FFF8E1;border:1.5px solid #E0AC00;
        border-radius:4px;padding:4px 6px;font:800 10px var(--font-ui);color:#6B5200;text-align:center;width:104px;line-height:1.2;
        box-shadow:0 3px 6px rgba(0,0,0,.12);opacity:0;transition:opacity .3s;pointer-events:none;text-transform:uppercase;z-index:3}
  .sign.show{opacity:1}
  .sign.off{background:#EEF1F5;border-color:#9AA9BA;color:#33475E}
  .sign::before{content:"";position:absolute;left:50%;top:-10px;width:30px;height:10px;transform:translateX(-50%);
        border:1.5px solid #8A9BAE;border-bottom:0;border-radius:15px 15px 0 0}
  .door.done .frame::after{content:"✓";position:absolute;right:-12px;top:-12px;width:26px;height:26px;border-radius:50%;background:var(--ok);
        color:#fff;font:800 14px/26px var(--font-ui);text-align:center;z-index:3;box-shadow:0 2px 6px rgba(0,0,0,.2)}

  .deco{position:absolute;pointer-events:none}
  .hwin{position:absolute;top:44px;width:150px;height:70px;border:5px solid #fff;border-radius:4px;background:linear-gradient(180deg,#BFE3FA,#E9F5FD);box-shadow:0 0 0 1px #C7D5E3}
  .hwin::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:#fff}
  .ceil{position:absolute;left:0;right:0;top:0;height:14px;background:#DCE6F0;border-bottom:2px solid #C7D5E3}
  .clamp{position:absolute;top:16px;width:90px;height:8px;margin-left:-45px;background:#fff;border-radius:0 0 8px 8px;box-shadow:0 6px 26px 8px rgba(255,248,214,.9)}
  .poster{bottom:212px;width:64px;height:84px;background:#fff;border:1px solid var(--line-2);border-radius:3px;padding:6px 5px;
          font:800 8.5px var(--font-ui);line-height:1.2;color:var(--ink-2);text-align:center;box-shadow:0 2px 0 rgba(0,0,0,.05)}
  .poster i{display:block;height:34px;margin:0 auto 5px;border-radius:3px}
  .bench{bottom:calc(var(--floor) - 6px);height:40px;z-index:1}
  .bench::before{content:"";position:absolute;left:0;right:0;top:0;height:9px;background:#5B7B9A;border-radius:3px}
  .bench::after{content:"";position:absolute;left:12px;right:12px;top:9px;bottom:0;border-left:6px solid #44607C;border-right:6px solid #44607C}
  .plant{bottom:calc(var(--floor) - 6px)}
  .coffee{position:absolute;bottom:calc(var(--floor) - 4px);width:70px;cursor:pointer;z-index:2}
  .winx{bottom:160px;width:120px;height:120px;border:6px solid #fff;border-radius:4px;background:linear-gradient(180deg,#BFE3FA,#E6F4FD);box-shadow:0 0 0 1px var(--line-2)}
  .exit-sign{bottom:262px;background:#1A7F5A;color:#fff;font:800 11px var(--font-ui);padding:4px 8px;border-radius:3px;letter-spacing:.06em}

  /* люди */
  .pp{position:absolute;bottom:20px;width:34px;height:64px;transform:translateX(-50%);
      transition:left .55s var(--ease),opacity .4s,bottom .3s;pointer-events:none}
  .pp svg{width:100%;height:100%;overflow:visible}
  .pp .body{animation:breathe 2.6s ease-in-out infinite;transform-box:view-box;transform-origin:17px 60px}
  @keyframes breathe{50%{transform:translateY(-.6px) scaleY(1.01)}}
  .pp.walking .legL{animation:stepA .32s ease-in-out infinite alternate}
  .pp.walking .legR{animation:stepB .32s ease-in-out infinite alternate}
  .pp.walking .body{animation:bob .16s ease-in-out infinite alternate}
  .legL,.legR{transform-box:view-box;transform-origin:17px 46px}
  @keyframes stepA{from{transform:rotate(16deg)}to{transform:rotate(-16deg)}}
  @keyframes stepB{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
  @keyframes bob{to{transform:translateY(-1.5px)}}
  .pp.flip svg{transform:scaleX(-1)}
  .me{z-index:80;bottom:14px;width:38px;height:72px}
  .me .tag{position:absolute;left:50%;top:-22px;transform:translateX(-50%);background:var(--sun-500);color:var(--ink);
           font:800 10px var(--font-ui);padding:2px 6px;border-radius:6px;white-space:nowrap}
  .me .tag::after{content:"";position:absolute;left:50%;bottom:-4px;margin-left:-4px;border:4px solid transparent;border-bottom:0;border-top-color:var(--sun-500)}
  .me .steam{position:absolute;left:50%;top:-6px;opacity:0;transition:opacity .4s}
  .me.angry .steam{opacity:1}
  .me .steam i{position:absolute;width:10px;height:10px;border-radius:50%;background:rgba(200,210,222,.9);animation:steam 1.2s infinite}
  .me .steam i:nth-child(2){animation-delay:.4s;left:-12px}.me .steam i:nth-child(3){animation-delay:.8s;left:8px}
  @keyframes steam{from{transform:translateY(0) scale(.5);opacity:.9}to{transform:translateY(-26px) scale(1.4);opacity:0}}
  .me.angry .tag{background:#E5484D;color:#fff}.me.angry .tag::after{border-top-color:#E5484D}
  .ghost{position:absolute;bottom:20px;width:30px;height:60px;transform:translateX(-50%);border:2px dashed var(--sky-700);
         border-radius:15px 15px 6px 6px;opacity:0;transition:left .55s var(--ease),opacity .3s;pointer-events:none;z-index:60}
  .ghost.show{opacity:.85}
  .ghost::after{content:"ваше место";position:absolute;left:50%;top:-18px;transform:translateX(-50%);font:700 9px var(--font-ui);
         color:var(--sky-700);white-space:nowrap;background:rgba(255,255,255,.9);padding:1px 4px;border-radius:4px}
  .ghost.alarm{border-color:var(--err);animation:blink .6s infinite}.ghost.alarm::after{content:"ваша очередь!";color:var(--err)}

  .bub{position:absolute;bottom:106px;transform:translate(-50%,6px);background:#fff;border:1.5px solid var(--ink);border-radius:12px;
       padding:5px 9px;font:600 12px/1.25 var(--font-ui);color:var(--ink);max-width:170px;width:max-content;text-align:center;
       opacity:0;transition:opacity .25s,transform .25s var(--ease);z-index:90;pointer-events:none}
  .bub.show{opacity:1;transform:translate(-50%,0)}
  .bub::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-5px;width:9px;height:9px;background:inherit;
       border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);transform:rotate(45deg)}
  .bub.door{bottom:254px;background:var(--ink);color:#fff}
  .bub.mine{background:var(--sun-500)}

  /* ---------- мини-карта ---------- */
  .map{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:8px 8px 6px;background:#fff;border-top:1px solid var(--line)}
  .mc{border:1px solid var(--line);border-radius:10px;padding:5px 2px 4px;text-align:center;cursor:pointer;position:relative;background:#fff;
      transition:background .25s,border-color .25s}
  .mc svg{width:17px;height:17px;color:var(--sky-700)}
  .mc .nm{font:600 9.5px var(--font-ui);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mc .st{font:800 12px var(--font-h);color:var(--ink);margin-top:1px;min-height:15px}
  .mc .dt{position:absolute;right:5px;top:5px;width:7px;height:7px;border-radius:50%;background:#3BB273}
  .mc .dt.wait{background:var(--sun-500)} .mc .dt.off{background:#B4C6DA} .mc .dt.bad{background:#E5484D}
  .mc.here{border-color:var(--sky-500);box-shadow:0 0 0 2px rgba(43,168,240,.25)}
  .mc.done{background:var(--ok-bg);border-color:#BFE3D0}.mc.done .st{color:var(--ok)}
  .mc.next{background:var(--sun-50);border-color:var(--sun-600)}
  .mc.alarm{background:var(--err-bg);border-color:var(--err);animation:blink .7s infinite}.mc.alarm .st{color:var(--err)}
  @keyframes blink{50%{opacity:.55}}

  .bottom{display:flex;gap:8px;padding:6px 8px calc(8px + env(safe-area-inset-bottom));background:#fff}
  .log{flex:1;background:var(--ink);color:#fff;border-radius:12px;padding:8px 10px;font-size:12.5px;line-height:1.3;min-height:46px;display:flex;gap:7px;align-items:center}
  .log time{color:var(--sun-500);font-weight:700;font-variant-numeric:tabular-nums;flex:none}
  .cbtn{flex:none;width:58px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer;font:700 10px var(--font-ui);color:var(--sky-900);
        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  .cbtn svg{width:20px;height:20px}
  .cbtn:disabled{opacity:.4}

  .btn{flex:1;height:46px;border-radius:12px;border:0;font:700 14px var(--font-ui);cursor:pointer}
  .btn:active{transform:scale(.97)}
  .btn.pri{background:var(--sky-700);color:#fff}.btn.sec{background:#fff;color:var(--sky-900);border:1px solid var(--line)}
  .btn.sun{background:var(--sun-500);color:var(--ink)}.btn.danger{background:var(--err);color:#fff}
  .actions{display:flex;gap:8px}

  .toast{position:fixed;left:50%;top:118px;transform:translate(-50%,-10px);opacity:0;z-index:20;width:calc(100% - 24px);max-width:480px;
         background:#fff;border:1px solid var(--line);border-left:5px solid var(--sky-500);border-radius:12px;padding:9px 12px;
         font-size:13.5px;box-shadow:0 12px 30px rgba(11,79,138,.18);transition:all .3s var(--ease);pointer-events:none}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.bad{border-left-color:var(--err)}.toast.good{border-left-color:var(--ok)}.toast.warn{border-left-color:var(--sun-600)}

  .overlay{position:fixed;inset:0;z-index:30;background:rgba(11,32,58,.45);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
  .overlay.show{opacity:1;pointer-events:auto}
  .sheet{width:100%;max-width:520px;background:#fff;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(30px);transition:transform .3s var(--ease);max-height:94dvh;overflow:auto}
  .overlay.show .sheet{transform:none}
  .overlay.center{align-items:center;padding:14px}.overlay.center .sheet{border-radius:22px;max-width:440px}
  .who{display:flex;gap:12px;align-items:center;margin-bottom:10px}
  .who svg{width:46px;height:86px;flex:none}
  .who .name{font-size:12px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
  .bubble{background:var(--subtle);border-radius:14px 14px 14px 4px;padding:10px 12px;font-size:16px;font-weight:600;line-height:1.3;margin-top:4px}
  .sheet p{font-size:14px;color:var(--ink-2);line-height:1.45;margin-bottom:12px}
  .hero{text-align:center}
  .hero .art{display:flex;justify-content:center;align-items:flex-end;height:92px;margin:2px 0 8px}
  .hero .art svg{width:40px;height:76px}.hero .art svg.big{width:46px;height:88px}
  .hero h1{font:800 29px var(--font-h);color:var(--sky-900)}
  .hero .lead{font-size:15px;color:var(--ink-2);margin:6px 0 14px}
  .rules{text-align:left;display:flex;flex-direction:column;gap:8px;margin:0 0 16px}
  .rules div{display:flex;gap:10px;font-size:14px;line-height:1.4;color:var(--ink-2)}
  .rules span{flex:none;width:24px;height:24px;border-radius:7px;background:var(--sky-50);color:var(--sky-700);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
  .best{font-size:13px;color:var(--ink-3);margin-top:10px}
  .rank{display:inline-block;background:var(--sun-500);color:var(--ink);font:800 20px var(--font-h);padding:8px 16px;border-radius:12px;transform:rotate(-2deg);margin:8px 0 12px}
  .big-t{font:800 40px var(--font-h);color:var(--sky-900);font-variant-numeric:tabular-nums}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0;text-align:left}
  .stats div{background:var(--subtle);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--ink-3)}
  .stats b{display:block;font-size:18px;color:var(--ink);font-family:var(--font-h)}
  .back{display:block;text-align:center;margin-top:12px;font-size:13px;color:var(--sky-700);text-decoration:none;font-weight:600}
  .tbtn svg{width:18px;height:18px;vertical-align:middle}
  /* обучение */
  .coach{position:fixed;left:50%;bottom:190px;transform:translate(-50%,12px);width:calc(100% - 24px);max-width:440px;z-index:25;
         background:var(--ink);color:#fff;border-radius:16px;padding:14px 14px 12px;box-shadow:0 14px 34px rgba(11,32,58,.35);
         opacity:0;pointer-events:none;transition:opacity .3s,transform .3s var(--ease)}
  .coach.show{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
  .coach::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-bottom:0;border-top-color:var(--ink)}
  .coach.top{bottom:auto;top:112px}.coach.top::after{display:none}
  .coach-txt{font-size:14.5px;line-height:1.45}
  .coach-txt b{color:var(--sun-500)}
  .coach-row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px}
  .coach-skip{background:none;border:0;color:#9FB3C8;font:600 12px var(--font-ui);cursor:pointer;padding:6px 0}
  .coach-ok{flex:none;height:38px;padding:0 18px;background:var(--sun-500);color:var(--ink)}
  .coach.wait .coach-ok{display:none}
  .mc.pulse{animation:pulse 1s infinite;border-color:var(--sun-600);background:var(--sun-50)}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(254,197,12,.7)}50%{box-shadow:0 0 0 7px rgba(254,197,12,0)}}
  /* меню, таблица, достижения, английский */
  .modes{display:flex;flex-direction:column;gap:8px}
  .modes .btn{width:100%;flex:none}
  .modes .btn small{display:block;font-weight:500;font-size:11.5px;opacity:.85;margin-top:1px}
  .modes .btn.tall{height:56px}
  .card{background:var(--subtle);border-radius:14px;padding:12px;margin-top:14px;text-align:left}
  .card h3{font:800 14px var(--font-h);color:var(--sky-900);margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .card h3 small{font:500 11.5px var(--font-ui);color:var(--ink-3)}
  .board{list-style:none;display:flex;flex-direction:column;gap:3px;font-size:13.5px}
  .board li{display:flex;gap:8px;align-items:center;background:#fff;border-radius:8px;padding:6px 9px}
  .board li b{width:20px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .board li span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .board li i{font-style:normal;font-weight:700;font-variant-numeric:tabular-nums}
  .board li.me{background:var(--sun-50);box-shadow:inset 0 0 0 1.5px var(--sun-600)}
  .board .empty{font-size:13px;color:var(--ink-3);padding:4px 2px}
  .linkbtn{background:none;border:0;color:var(--sky-700);font:700 13px var(--font-ui);cursor:pointer;padding:6px}
  .ach-grid{display:grid;grid-template-columns:1fr;gap:6px;margin-top:10px;text-align:left}
  .ach{display:flex;gap:10px;align-items:center;background:var(--subtle);border-radius:12px;padding:8px 10px;opacity:.55}
  .ach.got{opacity:1;background:#fff;box-shadow:inset 0 0 0 1.5px var(--sun-600)}
  .ach .ai{flex:none;width:36px;height:36px;border-radius:50%;background:#DCE6F0;color:#8A9BAE;display:flex;align-items:center;justify-content:center}

    hide(){ $('#coach').classList.remove('show'); this.target=null; },

      this.step=1; S.paused=true; this.waitGo=true;
      this.show('Это коридор поликлиники. Нажмите на кабинет <b>ЭКГ</b> внизу — герой пойдёт туда и займёт очередь.',{wait:true,target:'ekg'});
      render();
    },
    onGo(id){
      if (!this.on || !this.waitGo) return;
      this.waitGo=false; S.paused=false; this.hide();
      if (this.step===1) this.step=2; else if (this.step===3) this.step=4;
    },
    onArrive(id){
      if (this.step===2){
        this.firstId=id; this.step=3; S.paused=true; this.waitGo=true;
        const other = id==='surg' ? 'eye' : 'surg';

      } else if (this.step===4){

      }
    },
    ok(){

    },
    finish(){ manual=null; this.step=0; this.waitGo=false; this.hide(); localStorage.setItem(TUT_KEY,'1'); if (S && !S.over){ S.paused=false; updPause(); } render(); },
  };

  function buildWorld(){

    let h=`<div class="wall"></div><div class="panel"></div><div class="floor"></div><div class="ceil"></div>`;
    for(let lx=160; lx<WORLD_W; lx+=300) h+=`<div class="clamp" style="left:${lx}px"></div>`;
    for(let lx=260; lx<WORLD_W-200; lx+=300) h+=`<div class="hwin" style="left:${lx}px"></div>`;
    h+=`<div class="deco exit-sign" style="left:40px">← ВЫХОД</div>`;
    h+=`<div class="deco" style="left:30px;bottom:calc(var(--floor) - 2px);width:96px;height:178px;background:#E0E7EF;border:5px solid #9DB0C4;border-bottom:0;border-radius:3px">
          <div style="position:absolute;inset:12px 10px auto;height:60px;background:linear-gradient(180deg,#CFE6FA,#EAF4FD)"></div></div>`;
    const posters=[
      ['Мойте<br>руки','#2BA8F0'],['Бахилы<br>обязательны','#3BB273'],['Тишина!','#E5484D'],
      ['Грипп.<br>Прививка','#8E6BD8'],['Не курить','#E59A3B'],['Ходите<br>пешком','#2FA4A9']];
    CABS.forEach((c,i)=>{
      const x=DOOR[c.id];
      h+=`<div class="door" id="door-${c.id}" data-id="${c.id}" style="left:${x-46}px">
            <div class="lamp">ИДЁТ ПРИЁМ</div>
            <div class="plate"><b>${c.room}</b>${c.name}</div>
            <div class="frame"><div class="inside"></div><div class="leaf"><i class="win"></i><i class="handle"></i></div>
              <div class="sign" id="sign-${c.id}" style="top:66px"></div></div>
          </div>`;
      const [t,col]=posters[i];
      h+=`<div class="deco poster" style="left:${x+250}px"><i style="background:${col};opacity:.85"></i>${t}</div>`;
      if (i%2===0) h+=`<div class="deco bench" style="left:${x+120}px;width:200px"></div>`;
    });
    h+=`<div class="coffee" id="coffeeM" style="left:${COFFEE_X-35}px">
          <svg viewBox="0 0 70 150" width="70" height="150"><rect x="2" y="2" width="66" height="146" rx="6" fill="#C4383F"/>
          <rect x="9" y="12" width="52" height="40" rx="3" fill="#2B1B1B"/><text x="35" y="37" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="800" font-size="13" fill="#FEC50C">КОФЕ</text>
          <rect x="9" y="60" width="34" height="8" rx="2" fill="#F5E6E6"/><rect x="9" y="72" width="34" height="8" rx="2" fill="#F5E6E6"/><rect x="9" y="84" width="34" height="8" rx="2" fill="#F5E6E6"/>
          <circle cx="53" cy="66" r="4" fill="#FEC50C"/><rect x="49" y="78" width="9" height="16" rx="2" fill="#2B1B1B"/>
          <rect x="18" y="104" width="34" height="30" rx="3" fill="#2B1B1B"/><rect x="29" y="118" width="12" height="14" rx="1.5" fill="#fff"/></svg></div>`;
    h+=`<div class="deco plant" style="left:${COFFEE_X+60}px"><svg viewBox="0 0 50 90" width="50" height="90"><path d="M25 50C10 40 8 20 14 10c6 12 10 24 11 40zM25 50c15-10 17-30 11-40-6 12-10 24-11 40zM25 52C14 50 4 40 2 30c10 4 18 10 23 22zM25 52c11-2 21-12 23-22-10 4-18 10-23 22z" fill="#3BB273"/><path d="M12 56h26l-4 32H16z" fill="#C98E68"/></svg></div>`;
    h+=`<div class="deco winx" style="left:${WORLD_W-150}px"></div>`;
    w.innerHTML=h+`<div id="layer"></div>`;
  }

  /* ================= состояние ================= */
  let S, timer=null, curMs=0;
  const BEST_KEY='ochered_best_v1';
  const els=new Map();
  let P, ghosts={};

  function newGame(mode='free'){
    npcId=0;
    S = {
      mode, day:almatyDay(), seed: mode==='daily' ? 'day-'+almatyDay() : 'free-'+Math.random().toString(36).slice(2),
      t:480, speed:1, paused:false, over:false, nerves:100, stamps:{},
      loc:null, walkTo:null, walkUntil:0, px:START_X, inside:null, coffeeUntil:0,
      eyeReadyAt:null, eyeStage:0, xrayWarned:false,
      stat:{queueMin:0, letThrough:0, argued:0, argueWon:0, lost:0, coffee:0},
      cabs: CABS.map(c => ({...c, q:Array.from({length:c.init},()=>npc()), cur:null, ev:null, evUntil:0, grace:null, warned:false, nextWarned:false}))
    };
    $('#layer').innerHTML=''; els.clear(); ghosts={};
    P=document.createElement('div'); P.className='pp me';
    P.innerHTML=`<div class="tag">ВЫ</div><div class="steam"><i></i><i></i><i></i></div>`+fig({player:true});
    P.style.left=START_X+'px'; $('#layer').append(P);
    for (const c of CABS){ const g=document.createElement('div'); g.className='ghost'; $('#layer').append(g); ghosts[c.id]=g; }
    $('#speedBtn').textContent='×1'; updPause();
    renderStamps(); render(true);
    log('Поликлиника открылась. Нажмите на дверь или на кабинет внизу — вы пойдёте туда и займёте очередь.');
    setTimeout(()=>say('player','Так… шесть кабинетов.',2600),300);
  }

  const cab = id => S.cabs.find(c=>c.id===id);
  const myIdx = c => c.q.findIndex(x=>x.player);
  const allButTher = () => CABS.filter(c=>!c.final).every(c=>S.stamps[c.id]);
  const present = id => S.loc===id && !S.walkTo && !S.coffeeUntil && !S.inside;

  function docState(c){
    const t=S.t;
    if (t < c.open) return {k:'off', label:`Откроется в ${hhmm(c.open)}`};
    if (t >= c.close) return {k:'off', label:'Закрыто'};
    if (c.lunch && t>=c.lunch[0] && t<c.lunch[1] && !c.cur) return {k:'wait', label:`Обед до ${hhmm(c.lunch[1])}`};
    if (c.ev && t < c.evUntil) return {k:'wait', label:`${c.ev} · ${c.evUntil-t} мин`};
    if (c.cur && c.cur.delayed) return {k:'bad', label:'Приём затянулся'};
    return {k:'ok', label: c.cur ? 'Идёт приём' : 'Свободно'};
  }
  const canCall = c => { const k=docState(c).k; return k==='ok'||k==='bad'; };

  /* ================= такт: 1 игровая минута ================= */
  function tick(){
    if (S.paused || S.over) return;
    S.t++;
    const t=S.t;

    if (S.walkTo && t>=S.walkUntil) arrive(S.walkTo);
    if (S.coffeeUntil && t>=S.coffeeUntil){ S.coffeeUntil=0; log('Кофе выпит. Жить можно.'); say('player','Вот теперь можно жить.'); }

    for (const c of S.cabs){
      if (t===c.close && c.id==='xray'){
        c.q=[]; if (!(c.cur && c.cur.player)) c.cur=null;
        say({door:'xray'},'Рентген закрыт!');
        if (!S.stamps.xray && S.inside!=='xray'){ return lose('Рентген закрылся в 13:00, а печати рентгена у вас нет. «Приходите завтра к девяти».'); }
      }
      if (t===c.lunch?.[0]) log(`${c.name}: «Я на обед». Табличка на двери.`);
      if (c.ev && t===c.evUntil) c.ev=null;

      if (c.cur){
        if (!(c.ev && t<c.evUntil)) c.cur.left--;
        if (c.cur.left<=0){
          const wasMe=c.cur.player; c.cur=null;
          if (wasMe) finishMine(c);
        }
      }
      if (S.over) return;

      const me=myIdx(c);
      if (me===0 && c.cur && !c.nextWarned && !present(c.id) && !S.inside){
        c.nextWarned=true; toast(`Вы следующий к кабинету «${c.name}». Подходите!`,'warn'); SND.notify();
      }

      if (!c.cur && canCall(c)){
        if (c.id==='eye' && S.eyeStage===1 && t>=S.eyeReadyAt && present('eye')){
          if (c.q.length && !S.eyeAsked){ S.eyeAsked=true; if (H('eyeb',t)<.55){ eyeBlock(c); break; } }
          S.eyeStage=2; c.cur={player:true,left:3}; enterDoor(c,true);
          log('Окулист: «Капли подействовали? Заходите». Очередь ворчит.');
          if (c.q[0]) say(c.q[0].id,'А почему без очереди?!');
        } else if (c.q.length){
          const front=c.q[0];
          if (front.player){
            if (present(c.id)){
              c.q.shift(); c.grace=null; c.warned=false; c.nextWarned=false;
              if (c.final && !allButTher()){
                S.nerves-=15;
                say({door:c.id},'Без полного листа не приму!');
                toast('Терапевт: «Где остальные печати? Без полного листа не приму! Следующий!»','bad'); SND.bad();
                log('Терапевт выгнал вас без полного обходного листа. Место потеряно.');
              } else {
                c.cur={player:true,left:(c.id==='eye'&&S.eyeStage===3)?3:c.my}; enterDoor(c,true);
                log(`Вы зашли в кабинет: ${c.name}.`);
              }
            } else {
              if (c.grace===null){ c.grace=t+5; say({door:c.id},'Кто следующий? Ау!'); }
              if (!c.warned){ c.warned=true; toast(`Ваша очередь к кабинету «${c.name}»! Ждут 5 минут — бегите.`,'bad'); SND.alarm(); if (navigator.vibrate) try{navigator.vibrate([120,80,120]);}catch(e){} }
              if (t>=c.grace){
                c.q.shift(); c.grace=null; c.warned=false; c.nextWarned=false; S.nerves-=8; S.stat.lost++;
                say({door:c.id},'Нету? Следующий!');
                toast(`«Кто за мной был? Нету? Следующий!» Место к кабинету «${c.name}» пропало.`,'bad'); SND.bad();
                log(`Вас не дождались у кабинета «${c.name}».`);
              }
            }
          } else {
            if (H(c.id,t,'ev')<.09 && t<1000){
              const e=pickH(DOC_EVENTS,c.id,t,'evt'); c.ev=e.label; c.evUntil=t+rndH(...e.dur,c.id,t,'evd');
              log(`${c.name}: «${e.label}». Очередь стоит.`);
              if (present(c.id)) say(c.q[0].id, pick(['Ну сколько можно!','Опять…','Мы тут с утра стоим!']));
            } else {
              c.q.shift();
              const delayed=H(c.id,t,'dl')<.17;
              c.cur={p:front, left:rndH(...(front.svc||c.svc),c.id,t,'svc') + (delayed?rndH(10,22,c.id,t,'dly'):0), delayed};
              enterDoor(c,false);
            }
          }
        }
      }

      if (t>=c.open-30 && t<c.close-45 && t<930){
        const k = t>840 ? .5 : t>720 ? .75 : 1;
        if (H(c.id,t,'arr')<c.arrive*k) c.q.push(npc());
      }
      if (canCall(c) && t<960 && c.q.length>1 && H(c.id,t,'cut')<.013){
        startCut(c); if (S.paused) break;
      }
    }

    const here = S.loc && !S.walkTo && cab(S.loc);
    if (here && myIdx(here)>=0){
      S.stat.queueMin++; S.hereMin=(S.hereMin||0)+1;
      if (!S.firstCut && !TUT.on && S.hereMin>=10 && myIdx(here)>=1 && canCall(here) && !S.paused){ S.firstCut=true; startCut(here); }
      S.nerves -= docState(here).k==='ok' ? .05 : .15;
    }
    if (!S.xrayWarned && t===750 && !S.stamps.xray){ S.xrayWarned=true; toast('Рентген закрывается через 30 минут!','warn'); SND.notify(); }
    if (S.eyeStage===1 && t===S.eyeReadyAt){ toast('Капли подействовали. Подойдите к окулисту — пустят без очереди.','good'); SND.notify(); }

    S.nerves=Math.max(0,Math.min(100,S.nerves));
    if (S.nerves<=0) return lose('Нервы не выдержали. Вы скомкали обходной лист и ушли домой.');
    if (t>=1020) return lose('17:00. «Поликлиника закрывается! Приходите завтра к восьми».','time');
    render(); schedule();
  }

  function enterDoor(c, me){
    const d=$('#door-'+c.id); d.classList.add('open'); setTimeout(()=>d.classList.remove('open'),1100);
    const v=near(DOOR[c.id]); SND.door(v);
    if (me){ S.inside=c.id; S.loc=null; say({door:c.id},'Заходите!'); SND.ding(); }
    else if (Math.random()<.35){ say({door:c.id},pick(CALL_LINES)); SND.ding(v*.6); }
  }

  function finishMine(c){
    S.inside=null; S.loc=c.id;
    const d=$('#door-'+c.id); d.classList.add('open'); setTimeout(()=>d.classList.remove('open'),900);
    if (c.id==='eye' && S.eyeStage===0){
      S.eyeStage=1; S.eyeReadyAt=S.t+15;
      toast('Окулист закапала капли: «Посидите 15 минут и заходите без очереди».','warn');
      log('Капли закапаны. Через 15 минут к окулисту без очереди.');
      setTimeout(()=>say('player','Ничего не вижу…'),500); SND.bad();
      return;
    }
    S.stamps[c.id]=true; renderStamps(c.id); SND.stamp();
    toast(DONE_LINES[c.id],'good'); log(DONE_LINES[c.id]);
    setTimeout(()=>say('player', c.final?'Свобода!':'Есть печать!',1800),500);
    S.nerves=Math.min(100,S.nerves+6);
    if (c.final){ stopGame(); setTimeout(()=>{ render(); win(); },1300); }
  }

  /* ================= действия игрока ================= */
  function slotSp(n){ return n>9 ? Math.max(15,310/n) : 34; }
  function slotX(c,i,n=c.q.length){ return DOOR[c.id]+84+i*slotSp(n); }
  function targetX(id){
    if (id==='coffee') return COFFEE_X+48;
    const c=cab(id), me=myIdx(c);
    if (me>=0) return slotX(c,me);
    if ((id==='eye'&&S.eyeStage===1) || S.stamps[id]) return DOOR[id];
    return slotX(c,c.q.length,c.q.length+1);
  }

  function goTo(id){
    if (!S || S.over || (S.paused && !TUT.waitGo)) return;
    if (S.inside){ toast('Вы на приёме. Сначала дослушайте доктора.'); return; }
    if (S.coffeeUntil){ toast('Сначала допейте кофе.'); return; }
    if (id!=='coffee'){
      const c=cab(id);
      if (S.stamps[id]){ toast(`Печать «${c.name}» уже есть.`); return; }
      if (S.t>=c.close){ toast(`${c.name}: закрыто.`,'bad'); return; }
      if (S.loc===id && !S.walkTo) return;
    }
    if (S.walkTo===id) return;
    const cur=P.offsetLeft, tx=Math.round(targetX(id));
    const min=Math.max(1,Math.round(Math.abs(tx-cur)/PX_PER_MIN));
    S.loc=null; S.walkTo=id; S.walkUntil=S.t+min; S.px=cur; S.hereMin=0;
    P.style.left=cur+'px'; void P.offsetLeft;
    P.style.transition=`left ${(min*WALK_MS/S.speed)/1000}s linear, opacity .3s, bottom .3s`;
    P.classList.toggle('flip', tx<cur); P.classList.add('walking'); clearTimeout(P._w);
    P.style.left=tx+'px';
    SND.click(); SND.walk(true,S.speed); TUT.onGo(id);
    render(); schedule();
  }

  function arrive(id){
    S.walkTo=null; P.classList.remove('walking'); S.px=P.offsetLeft; SND.walk(false);
    if (id==='coffee'){
      SND.coffee();
      S.px=COFFEE_X+48; S.loc=null; S.coffeeUntil=S.t+5; S.nerves=Math.min(100,S.nerves+25); S.stat.coffee++;
      log('Кофе из автомата: 5 минут, зато нервы на месте.'); say('player','Американо, пожалуйста…');
      return;
    }
    S.loc=id;
    const c=cab(id);
    if (myIdx(c)<0 && !(id==='eye' && S.eyeStage===1)){
      const last=c.q[c.q.length-1];
      let extra='', reply=last ? pick(['Я. Вы за мной.','Я последняя.','За мной будете.']) : null;
      if (c.q.length && H('join',S.t,id)<.3){
        const n=rndH(1,2,'joinn',S.t,id); for(let i=0;i<n;i++) c.q.push(npc());
        extra = n===1 ? ' — «За мной ещё мужчина занимал».' : ' — «За мной ещё двое занимали».';
        reply = n===1 ? 'За мной ещё мужчина занимал!' : 'За мной ещё двое занимали!';
      }
      c.q.push({player:true});
      say('player', last ? 'Кто последний?' : 'Никого? Отлично!', 1500);
      if (reply && last) setTimeout(()=>say(last.id, reply, 2200), 900);
      log(`«Кто последний?» Вы заняли очередь: ${c.name}${extra}`);
      if (c.final && !allButTher()) toast('Терапевт примет только с остальными пятью печатями. Но очередь можно занять заранее.','warn');
    } else {
      log(`Вы вернулись к кабинету «${c.name}».`);
    }
    TUT.onArrive(id);
  }

  function coffee(){
    if (!S||S.over||S.paused||S.inside||S.coffeeUntil) return;
    goTo('coffee');
  }

  /* ================= наглые ================= */
  function startCut(c){
    if (present(c.id) && myIdx(c)>=0) S.firstCut=true;
    const me=myIdx(c);
    let type=pickH(CUTTERS,c.id,S.t,'ct');
    if (type.pos==='before' && me<1) type=CUTTERS[0];
    const isHere = present(c.id) && me>=0;
    const where = type.pos==='front' ? 0 : Math.max(0,me);
    const people = Array.from({length:type.n||1},(_,i)=>({...npc(i===0?type.kind:'norm'), svc:type.svc}));

    if (!isHere){
      c.q.splice(where,0,...people); render();
      setTimeout(()=>say(people[0].id, type.line, 2600),600);
      if (me>=0) log(`Пока вас не было: ${type.who.toLowerCase()} без очереди к кабинету «${c.name}».`);
      return;
    }
    S.paused=true; updPause(); SND.murmur(); SND.walk(false);
    $('#cutAva').innerHTML=fig(people[0]);
    $('#cutWho').textContent=type.who+' · '+c.name;
    $('#cutLine').textContent='«'+type.line+'»';
    $('#cutNote').textContent='Лезут прямо перед вами. Что делаете?' + (localStorage.getItem('ochered_cut_tip') ? '' : ' Совет: спор может помочь, но тратит нервы.');
    localStorage.setItem('ochered_cut_tip','1');
    const box=$('#cutActions'); box.innerHTML='';
    const done=(msg,kind,sayLine)=>{ $('#cutOv').classList.remove('show'); S.paused=false; updPause(); toast(msg,kind); render();
      if (sayLine) setTimeout(()=>say(people[0].id, sayLine, 2200),600); };
    if (type.win){
      const b1=document.createElement('button'); b1.className='btn danger'; b1.textContent='Возмутиться';
      b1.onclick=()=>{ S.stat.argued++; say('player',pick(['Тут очередь вообще-то!','Совесть есть?','Мы все с утра стоим!']),1800);
        if (H('arg',S.t,c.id)<type.win){ S.stat.argueWon++; c.q.push(...people); S.nerves-=3; SND.good(); done(type.ok,'good',type.okSay); log(type.ok); }
        else { c.q.splice(where,0,...people); S.nerves-=12; if(type.kind==='granny')S.stat.letThrough++; SND.bad(); done(type.fail,'bad',type.failSay); log(type.fail); }
      };
      const b2=document.createElement('button'); b2.className='btn sec'; b2.textContent='Промолчать';
      b2.onclick=()=>{ c.q.splice(where,0,...people); S.nerves-=5; if(type.kind==='granny')S.stat.letThrough++;
        done('Вы промолчали. Внутри что-то кипит.','',type.failSay); log(`${type.who} — перед вами. Вы промолчали.`); };
      box.append(b1,b2);
    } else {
      const b=document.createElement('button'); b.className='btn sec'; b.textContent='Ну ладно…';
      b.onclick=()=>{ c.q.splice(where,0,...people); S.nerves-=4; done(type.fail,'',type.failSay); log(type.fail); };
      box.append(b);
    }
    $('#cutOv').classList.add('show');
  }

  /* ================= очередь против «прокапанного» ================= */
  function eyeBlock(c){
    const p=c.q.find(x=>!x.player) || npc('granny');
    S.paused=true; updPause(); SND.murmur(); SND.walk(false);
    $('#cutAva').innerHTML=fig(p);
    $('#cutWho').textContent='Очередь · Окулист';
    $('#cutLine').textContent='«И что, что прокапали? Мы тоже с утра стоим! Становитесь в конец!»';
    $('#cutNote').textContent='Окулист обещала пустить без очереди, но очередь против.';
    say(p.id,'Становитесь в конец!',2400);
    const box=$('#cutActions'); box.innerHTML='';
    const close=(msg,kind)=>{ $('#cutOv').classList.remove('show'); S.paused=false; updPause(); toast(msg,kind); log(msg); render(); };
    const toEnd=()=>{ S.eyeStage=3; c.q.push({player:true}); };
    const b1=document.createElement('button'); b1.className='btn danger'; b1.textContent='Возмутиться';
    b1.onclick=()=>{ S.stat.argued++; say('player','Мне доктор сказала!',1800);
      if (H('eyearg',S.t)<.45){ S.stat.argueWon++; S.nerves-=3; SND.good(); S.eyeStage=2; c.cur={player:true,left:3}; enterDoor(c,true);
        close('Окулист выглянула: «Пациент после капель, пропустите!» Вы зашли.','good'); }
      else { S.nerves-=10; SND.bad(); toEnd(); close('Очередь стоит стеной. Пришлось встать в конец.','bad'); }
    };
    const b2=document.createElement('button'); b2.className='btn sec'; b2.textContent='Встать в конец';
    b2.onclick=()=>{ S.nerves-=4; toEnd(); close('Вы встали в конец очереди к окулисту. Капли пока действуют.'); };
    box.append(b1,b2);
    $('#cutOv').classList.add('show');
  }

  /* ================= отрисовка ================= */
  function renderStamps(pop){
    $('#stamps').innerHTML = CABS.map(c =>
      `<div class="stamp ${S.stamps[c.id]?'got':''} ${pop===c.id?'pop':''}" title="${c.name}">${ICONS[c.id]}</div>`).join('');
  }
  function mkPerson(p){
    const el=document.createElement('div'); el.className='pp'; el.innerHTML=fig(p);
    el.querySelector('.body').style.animationDelay=(-Math.random()*2.6).toFixed(2)+'s';
    return el;
  }
  function moveEl(el,x){
    const old=+el.dataset.x;
    if (old===x) return;
    el.dataset.x=x; el.style.left=x+'px';
    if (!isNaN(old) && Math.abs(old-x)>4){
      el.classList.toggle('flip', x>old);
      el.classList.add('walking'); clearTimeout(el._w); el._w=setTimeout(()=>el.classList.remove('walking','flip'),560);
    }
  }

  function render(first){
    const t=S.t, layer=$('#layer');
    $('#clock').innerHTML=`${hhmm(t)}<small>до закрытия ${dur(Math.max(0,1020-t))}</small>`;
    const n=Math.round(S.nerves);
    $('#nervesTxt').textContent=n;
    const bar=$('#nervesBar'); bar.style.width=n+'%'; bar.className=n<30?'low':n<60?'mid':'';

    const live=new Set();
    for (const c of S.cabs){
      const len=c.q.length; c._myX=null;
      c.q.forEach((p,i)=>{
        const x=Math.round(slotX(c,i,len));
        if (p.player){ c._myX=x; return; }
        live.add(p.id);
        let el=els.get(p.id);
        if (!el){
          el=mkPerson(p); els.set(p.id,el);
          const from = first ? x : x+170;
          el.style.left=from+'px'; el.dataset.x=from; el.style.opacity=first?1:0; layer.append(el);
          void el.offsetLeft;
        }
        el.style.opacity=1; el.style.zIndex=String(40-Math.min(i,30));
        moveEl(el,x);
      });
      const st=docState(c), d=$('#door-'+c.id), sg=$('#sign-'+c.id);
      d.classList.toggle('busy', !!c.cur);
      d.classList.toggle('done', !!S.stamps[c.id]);
      const showSign = st.k==='off' || st.k==='wait';
      sg.className='sign'+(showSign?' show':'')+(st.k==='off'?' off':'');
      if (showSign) sg.textContent=st.label;
      const g=ghosts[c.id];
      if (c._myX!=null && !present(c.id) && S.walkTo!==c.id){
        g.style.left=c._myX+'px'; g.classList.add('show'); g.classList.toggle('alarm', c.grace!==null);
      } else g.classList.remove('show','alarm');
    }
    for (const [id,el] of els){
      if (live.has(id)) continue;
      const into=S.cabs.find(c=>c.cur && c.cur.p && c.cur.p.id===id);
      if (into){ moveEl(el, DOOR[into.id]); el.style.zIndex='45'; setTimeout(()=>el.style.opacity=0,420); }
      else el.style.opacity=0;
      els.delete(id); setTimeout(()=>el.remove(),1000);
    }

    // игрок
    if (!S.walkTo){
      let tx;
      if (S.inside) tx=DOOR[S.inside];
      else if (S.coffeeUntil) tx=COFFEE_X+48;
      else if (S.loc){ const c=cab(S.loc); tx = c._myX!=null ? c._myX : DOOR[c.id]; }
      else tx=S.px;
      const old=S.px;
      P.style.transition='left .55s cubic-bezier(.2,.7,.2,1), opacity .3s, bottom .3s';
      if (Math.abs(tx-old)>4 && !S.inside){
        P.classList.toggle('flip', tx<old); P.classList.add('walking'); clearTimeout(P._w);
        P._w=setTimeout(()=>P.classList.remove('walking'),560);
      }
      P.style.left=tx+'px'; S.px=tx;
    }
    P.style.opacity = S.inside ? 0 : 1;
    P.style.bottom = (S.loc && !S.walkTo && myIdx(cab(S.loc))<0) ? '6px' : '14px';
    P.classList.toggle('angry', S.nerves<30);
    P.querySelector('.tag').textContent = S.nerves<30 ? 'ВЫ · на нервах' : 'ВЫ';

    $('#map').innerHTML = CABS.map(cc=>{
      const c=cab(cc.id), me=myIdx(c), st=docState(c);
      let cls='', txt='—';
      if (S.stamps[c.id]){ cls='done'; txt='✓'; }
      else if (S.inside===c.id){ cls='here'; txt='приём'; }
      else if (c.id==='eye' && S.eyeStage===1){ txt = t>=S.eyeReadyAt ? 'без оч.' : `${S.eyeReadyAt-t} мин`; cls = t>=S.eyeReadyAt?'next':''; }
      else if (me===0 && c.grace!==null && !present(c.id)){ cls='alarm'; txt='ВАША!'; }
      else if (me===0){ cls='next'; txt='след.'; }
      else if (me>0) txt=`${me+1}-й`;
      if ((present(c.id)||S.walkTo===c.id) && cls!=='alarm' && cls!=='done' && !cls.includes('here')) cls+=' here';
      if (TUT.target===c.id) cls+=' pulse';
      return `<div class="mc ${cls}" data-id="${c.id}" role="button" aria-label="${c.name}"><span class="dt ${st.k}"></span>${ICONS[c.id]}<div class="nm">${c.short}</div><div class="st">${txt}</div></div>`;
    }).join('');
    $('#coffeeBtn').disabled = !!(S.inside||S.coffeeUntil||S.over);
  }

  /* ================= реплики ================= */
  function say(who, text, ms=2200){
    if (!S) return;
    let x, cls='bub';
    if (who==='player'){ x=P.offsetLeft; cls+=' mine'; }
    else if (who && who.door){ x=DOOR[who.door]; cls+=' door'; }
    else { const el=els.get(who); if(!el) return; x=+el.dataset.x; }
    const b=document.createElement('div'); b.className=cls; b.textContent=text; b.style.left=x+'px';
    if (who==='player') b.style.bottom='114px';
    $('#layer').append(b);
    const nv=near(x); if (nv>.3) SND.blip(nv*.8, who==='player'?1.35:(who&&who.door?.8:1+Math.random()*.4));
    requestAnimationFrame(()=>requestAnimationFrame(()=>b.classList.add('show')));
    setTimeout(()=>{ b.classList.remove('show'); setTimeout(()=>b.remove(),300); }, ms);
  }
  function log(msg){ $('#log').innerHTML=`<time>${hhmm(S.t)}</time><span>${msg}</span>`; }
  let toastT;
  function toast(msg,kind=''){
    const el=$('#toast'); el.className='toast show '+kind; el.textContent=msg;
    clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),3400);
  }

  /* ================= камера ================= */
  function near(x){ const vw=scene.clientWidth/SC; return Math.max(.12, 1-Math.abs(x-(cam+vw/2))/700); }
  let cam=0, manual=null, manualT=null, drag=null, justDragged=false;
  const scene=$('#scene'), world=$('#world');
  let SC=1;
  function fit(){ const h=scene.clientHeight; SC=Math.max(.85,Math.min(1.12,h/380)); world.style.height=(h/SC)+'px'; }
  window.addEventListener('resize',fit);
  function loop(){
    const vw=scene.clientWidth/SC;
    let target;
    if (manual!==null) target=manual;
    else {
      const px = P ? P.offsetLeft : START_X; target = px - vw/2;
      const id = S && !S.walkTo && (S.inside||S.loc);
      if (id && DOOR[id]!=null) target = Math.max(px - vw + 50, Math.min(target, DOOR[id]-62));
    }
    target=Math.max(0,Math.min(WORLD_W-vw,target));
    if (manual!==null) manual=target;
    cam += (target-cam)*(manual!==null?0.35:0.1);
    world.style.transform=`translate3d(${(-cam*SC).toFixed(1)}px,0,0) scale(${SC})`;
    requestAnimationFrame(loop);
  }
  scene.addEventListener('pointerdown',e=>{ drag={x:e.clientX,cam,moved:false}; });
  window.addEventListener('pointermove',e=>{ if(!drag) return; const dx=e.clientX-drag.x; if(Math.abs(dx)>6) drag.moved=true;
    if(drag.moved){ manual=drag.cam-dx/SC; clearTimeout(manualT); } });
  window.addEventListener('pointerup',()=>{ if(!drag) return; const moved=drag.moved; drag=null;
    if (moved){ clearTimeout(manualT); manualT=setTimeout(()=>manual=null,2500); justDragged=true; setTimeout(()=>justDragged=false,60); } });
  scene.addEventListener('click',e=>{
    if (justDragged) return;
    const d=e.target.closest('.door'); if (d){ manual=null; return goTo(d.dataset.id); }
    if (e.target.closest('#coffeeM')){ manual=null; return coffee(); }
  });
  $('#map').addEventListener('click',e=>{ const m=e.target.closest('.mc'); if(m){ manual=null; goTo(m.dataset.id); } });

  /* ================= старт / финал ================= */
  function rankFor(m){
    if (m<=240) return 'Ниндзя поликлиники';
    if (m<=300) return 'Опытный пациент';
    if (m<=360) return 'Знаток коридоров';
    if (m<=420) return 'Терпеливый как камень';
    return 'Ветеран очередей';
  }
  const crowd = () => [npc('granny'),npc(),npc('ask'),{player:true},npc('claim'),npc(),npc('nurse')]
      .map(p=>fig(p,p.player?'big':'')).join('');
  const RULES = `<div class="rules">
        <div><span>1</span>Соберите 6 печатей. Терапевт — последним, с полным листом.</div>
        <div><span>2</span>Нажмите на дверь или на кабинет внизу: вы пойдёте туда и займёте очередь. Занимать можно в нескольких сразу.</div>
        <div><span>3</span>Когда подходит ваша очередь, нужно стоять у двери. Не успели за 5 минут — место пропало.</div>
        <div><span>4</span>Бабушки, «мне только спросить» и доктор на обеде прилагаются. Берегите нервы.</div>
      </div>`;
  const PLAY_I='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>';
  const enBlock = () => `<div class="card"><h3>Как это звучит по-английски <small>нажмите, чтобы послушать</small></h3>
      <div class="en">${EN.map(e=>`<button data-en="${e.id}" class="${heardEN.has(e.id)?'played':''}"><span class="pl">${PLAY_I}</span><span><b>${e.en}</b><small>${e.ru}</small></span></button>`).join('')}</div></div>
    <div class="cta"><b>Врачу — медицинский английский</b>
      <p>Такие фразы нужны на приёме, на собеседовании в клинику за рубежом и на USMLE. Doctors Speak учит говорить с пациентом по-английски — короткими уроками с телефона.</p>
      <a href="/tbltfree/">Попробовать бесплатный урок</a></div>`;
  function bindEN(){
    document.querySelectorAll('[data-en]').forEach(b=>b.onclick=()=>{
      const e=EN.find(x=>x.id===b.dataset.en); if(!speakEN(e.en)) toast('В этом браузере нет озвучки. Попробуйте Chrome или Safari.');
      heardEN.add(e.id); b.classList.add('played');
      if (heardEN.size===6){ const f=unlock({stat:S.stat||{}, won:false}); if (f.length){ SND.sparkle(); toast(`Достижение: «${f.map(a=>a.name).join('», «')}»`,'good'); } }
    });
  }
  const achLine = () => { const got=achGot(); return `${ACH.filter(a=>got[a.id]).length} из ${ACH.length}`; };

  async function loadBoard(el, me){
    el.innerHTML='<div class="empty">Загружаем…</div>';
    try{ el.innerHTML=boardHTML(await fetchTop(almatyDay()), me); }
    catch(e){ el.innerHTML='<div class="empty">Таблица пока недоступна. Загляните позже.</div>'; }
  }

  function showStart(){
    flushPending();
    const best=+localStorage.getItem(BEST_KEY)||0, day=almatyDay();
    $('#startSheet').innerHTML=`
      <div class="art">${crowd()}</div>
      <h1>Кто последний?</h1>
      <div class="lead">Пройдите медкомиссию быстрее всех. Поликлиника работает до 17:00.</div>
      <div class="modes">
        <button class="btn pri tall" id="goDaily">Забег дня<small>${dayRu(day)} · у всех одинаковые очереди</small></button>
        <button class="btn sec" id="goFree">Свободная игра</button>
      </div>
      <div class="card"><h3>Лучшие сегодня <small>${dayRu(day)}</small></h3><div id="topBoard"></div></div>
      <details class="rules-d"><summary>Правила</summary>${RULES}</details>
      <div style="display:flex;justify-content:center;gap:4px;margin-top:8px;flex-wrap:wrap">
        <button class="linkbtn" id="achBtn">Достижения: ${achLine()}</button>
        ${best?`<span class="best" style="margin:6px 0 0">· Рекорд: ${dur(best)}</span>`:''}
      </div>
      <a class="back" href="/">← На главную Doctors Speak</a>`;
    $('#goDaily').onclick=()=>start('daily');
    $('#goFree').onclick=()=>start('free');
    $('#achBtn').onclick=()=>{ SND.init(); SND.click(); showAch(); };
    loadBoard($('#topBoard'));
    $('#startOv').classList.add('show');
  }
  let lastMode='daily';
  function start(mode=lastMode){
    lastMode=mode; SND.init(); SND.click();
    $('#startOv').classList.remove('show'); newGame(mode); schedule();
    SND.ambient(true); TUT.begin();
  }
  function stopGame(){ S.over=true; clearInterval(timer); timer=null; curMs=0; SND.walk(false); SND.ambient(false); TUT.step && TUT.finish(); }

  function endButtons(won){
    return `<div class="actions" style="margin-top:14px">${won?'<button class="btn sun" id="share">Карточка для сторис</button>':''}<button class="btn pri" id="again">${won?'Ещё раз':'Попробовать ещё'}</button></div>
      <button class="linkbtn" id="toMenu" style="display:block;margin:8px auto 0">Меню и таблица</button>`;
  }
  function bindEnd(r){
    $('#again').onclick=()=>start(S.mode);
    $('#toMenu').onclick=()=>{ SND.click(); showStart(); };
    if ($('#share')) $('#share').onclick=()=>shareCard(r);
    bindEN();
  }

  function win(){
    const m=S.t-480, best=+localStorage.getItem(BEST_KEY)||0;
    const isBest=!best || m<best; if (isBest) localStorage.setItem(BEST_KEY,m);
    const rank=rankFor(m);
    const r={won:true, min:m, rank, stat:S.stat, nerves:S.nerves, mode:S.mode, day:S.day};
    const fresh=unlock(r);
    SND.fanfare(); if (fresh.length) setTimeout(()=>SND.sparkle(),1500);
    $('#startSheet').innerHTML=`
      <div class="art">${crowd()}</div>
      <h1>Годен!</h1>
      <div class="lead">${S.mode==='daily'?'Забег дня пройден':'Медкомиссия пройдена'} в ${hhmm(S.t)}</div>
      <div class="big-t">${dur(m)}</div>
      <div class="rank">${rank}</div>
      ${isBest?'<div class="best" style="color:var(--ok);font-weight:700">Новый личный рекорд!</div>':`<div class="best">Рекорд: ${dur(best)}</div>`}
      ${endButtons(true)}
      ${S.mode==='daily'?`<div class="card"><h3>Забег дня <small>${dayRu(S.day)}</small></h3><div id="dayBoard"></div><div id="dayNote"></div></div>`:''}
      <div class="stats">
        <div><b>${dur(S.stat.queueMin)}</b>простояли в очередях</div>
        <div><b>${S.stat.letThrough}</b>бабушек пропустили</div>
        <div><b>${S.stat.argueWon} из ${S.stat.argued}</b>споров выиграли</div>
        <div><b>${S.stat.coffee}</b>стаканов кофе</div>
      </div>
      ${fresh.length?`<div class="card"><h3>Новые достижения <small>${achLine()}</small></h3><div class="ach-grid" style="margin:0">${fresh.map(a=>achHTML(a,true,true)).join('')}</div></div>`:''}
      ${enBlock()}
      <a class="back" href="/">← На главную Doctors Speak</a>`;
    bindEnd(r);
    $('#startOv').classList.add('show');
    if (S.mode==='daily') dailySubmit(m);
  }
  async function dailySubmit(m){
    const board=$('#dayBoard'), note=$('#dayNote');
    let me=null;
    try{
      const res=await submitScore(S.day,m);
      if (res.needLogin){
        localStorage.setItem(PENDING_KEY, JSON.stringify({day:S.day, min:m}));
        note.innerHTML='<div class="login-note">Чтобы попасть в таблицу, <a href="/login.html">войдите в аккаунт Doctors Speak</a> или <a href="/register.html">зарегистрируйтесь</a> — это бесплатно. Результат сохранится и запишется, когда вы вернётесь в игру сегодня.</div>';
      } else me={name:res.name, min:res.best};
    }catch(e){ note.innerHTML='<div class="empty" style="margin-top:6px">Не удалось записать результат. Проверьте интернет.</div>'; }
    loadBoard(board, me);
  }

  function lose(reason, why='other'){
    stopGame(); render();
    const got=Object.keys(S.stamps).length;
    const fresh=unlock({won:false, why, stat:S.stat, mode:S.mode});
    SND.trombone(); if (fresh.length) setTimeout(()=>SND.sparkle(),1900);
    $('#startSheet').innerHTML=`
      <div class="art">${crowd()}</div>
      <h1>Не прошли</h1>
      <div class="lead">${reason}</div>
      <div class="stats">
        <div><b>${got} из 6</b>печатей собрали</div>
        <div><b>${dur(S.stat.queueMin)}</b>простояли в очередях</div>
        <div><b>${S.stat.letThrough}</b>бабушек пропустили</div>
        <div><b>${S.stat.lost}</b>раз потеряли место</div>
      </div>
      ${fresh.length?`<div class="card"><h3>Новые достижения</h3><div class="ach-grid" style="margin:0">${fresh.map(a=>achHTML(a,true,true)).join('')}</div></div>`:''}
      ${endButtons(false)}
      ${enBlock()}
      <a class="back" href="/">← На главную Doctors Speak</a>`;
    bindEnd({});
    $('#startOv').classList.add('show');
  }

  async function shareCard(r){
    SND.click();
    const btn=$('#share'); btn.disabled=true; btn.textContent='Рисуем карточку…';
    try{
      const blob=await storyCard(r);
      const file=new File([blob],'kto-posledniy.png',{type:'image/png'});
      const text=`Медкомиссия пройдена за ${dur(r.min)} в игре «Кто последний?». А ты быстрее? kazdoctors.com/ochered/`;
      if (navigator.canShare && navigator.canShare({files:[file]})){
        try{ await navigator.share({files:[file], text}); }catch(e){}
      } else {
        const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=file.name; document.body.append(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(a.href),4000);
        toast('Картинка сохранена — добавьте её в сторис.','good');
      }
    }catch(e){ toast('Не получилось нарисовать карточку.','bad'); }
    btn.disabled=false; btn.textContent='Карточка для сторис';
  }

  /* ================= управление ================= */
  function schedule(){
    if (!S || S.over){ clearInterval(timer); timer=null; curMs=0; return; }
    const ms=(S.walkTo?WALK_MS:TICK_MS)/S.speed;
    if (ms!==curMs){ clearInterval(timer); timer=setInterval(tick,ms); curMs=ms; }
  }
  function updPause(){ $('#pauseBtn').textContent = S && S.paused ? '▶' : '❚❚'; }
  $('#speedBtn').onclick=()=>{ if(!S||S.over)return; S.speed=S.speed===1?2:1; $('#speedBtn').textContent='×'+S.speed; SND.click(); if (S.walkTo) SND.walk(true,S.speed); schedule(); };
  $('#pauseBtn').onclick=()=>{ if(!S||S.over||TUT.on||$('#cutOv').classList.contains('show'))return; S.paused=!S.paused; updPause(); };
  $('#coffeeBtn').onclick=coffee;
  document.addEventListener('visibilitychange',()=>{ if(document.hidden && S && !S.over && !S.paused && !$('#cutOv').classList.contains('show')){ S.paused=true; updPause(); } });

  $('#soundBtn').innerHTML = SND.muted ? SOUND_OFF : SOUND_ON;
  $('#soundBtn').onclick=()=>{ SND.init(); const m=SND.toggle(); $('#soundBtn').innerHTML = m ? SOUND_OFF : SOUND_ON; if(!m) SND.click(); };
  window.__game = { get S(){return S}, tick, goTo, newGame, start, card:storyCard, stop:()=>{clearInterval(timer);timer=null;curMs=0;} };

  buildWorld();
  S={t:480,nerves:100,stamps:{},cabs:CABS.map(c=>({...c,q:[],cur:null})),stat:{},over:true};
  renderStamps(); showStart();
  fit(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
