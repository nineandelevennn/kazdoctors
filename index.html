<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Doctors Speak — Медицинский английский</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --kz-blue: #00A1DE;
            --kz-blue-dark: #007099;
            --kz-gold: #FFC72C;
            --white: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: linear-gradient(145deg, #00A1DE 0%, #006890 100%);
            color: var(--white);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 16px;
        }

        /* Декоративный элемент солнышка на фоне */
        .sun-bg {
            position: absolute;
            top: -10%;
            right: -15%;
            width: 260px;
            height: 260px;
            background: radial-gradient(circle, rgba(255, 199, 44, 0.25) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        header {
            position: relative;
            z-index: 1;
            text-align: center;
            margin-top: 5px;
        }

        .brand-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: var(--kz-gold);
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 1px;
            padding: 5px 14px;
            border-radius: 20px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 1.35rem;
            font-weight: 800;
            line-height: 1.2;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 0.8rem;
            opacity: 0.9;
            margin-top: 6px;
            font-weight: 400;
        }

        main {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            flex-grow: 1;
            justify-content: center;
        }

        .trainer-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-left: 5px solid var(--kz-gold);
            border-radius: 14px;
            padding: 16px;
            text-decoration: none;
            color: var(--white);
            transition: all 0.2s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }

        .trainer-card:active {
            transform: scale(0.98);
            background: rgba(255, 255, 255, 0.22);
        }

        .card-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .card-icon {
            width: 44px;
            height: 44px;
            background: rgba(255, 199, 44, 0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            flex-shrink: 0;
            border: 1px solid rgba(255, 199, 44, 0.4);
        }

        .card-text h2 {
            font-size: 0.98rem;
            font-weight: 700;
            margin-bottom: 2px;
            color: var(--white);
        }

        .card-text p {
            font-size: 0.73rem;
            opacity: 0.85;
            line-height: 1.25;
        }

        .arrow-icon {
            width: 20px;
            height: 20px;
            fill: var(--kz-gold);
            flex-shrink: 0;
            margin-left: 6px;
        }

        footer {
            position: relative;
            z-index: 1;
            text-align: center;
            margin-bottom: 5px;
        }

        .instagram-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--kz-gold);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 199, 44, 0.3);
        }

        /* Корректировка под маленькие экраны */
        @media (max-height: 640px) {
            h1 { font-size: 1.15rem; }
            .subtitle { font-size: 0.75rem; }
            .trainer-card { padding: 12px; }
            .card-icon { width: 38px; height: 38px; font-size: 1.1rem; }
            .card-text h2 { font-size: 0.9rem; }
            .card-text p { font-size: 0.68rem; }
        }
    </style>
</head>
<body>

    <div class="sun-bg"></div>

    <header>
        <div class="brand-badge">@doctors.speak</div>
        <h1>Медицинский Английский</h1>
        <p class="subtitle">Выучите medical vocabulary с нами!</p>
    </header>

    <main>
        <!-- Анатомический тренажер -->
        <a href="./anatomic/" class="trainer-card">
            <div class="card-content">
                <div class="card-icon">🫀</div>
                <div class="card-text">
                    <h2>Anatomy Terms</h2>
                    <p>Bones and organs</p>
                </div>
            </div>
            <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
        </a>
        
        <!-- Клинический тренажер -->
        <a href="./clinical/" class="trainer-card">
            <div class="card-content">
                <div class="card-icon">🩺</div>
                <div class="card-text">
                    <h2>Clinical English</h2>
                    <p>Symptoms, signs, diagnostics</p>
                </div>
            </div>
            <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
        </a>
        

        <!-- Академический тренажер -->
        <a href="./academic/" class="trainer-card">
            <div class="card-content">
                <div class="card-icon">📚</div>
                <div class="card-text">
                    <h2>Academic English</h2>
                    <p>Terms in articles, guidelines and presentations</p>
                </div>
            </div>
            <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
        </a>


        <!-- Академический тренажер -->
        <a href="./grammar/" class="trainer-card">
            <div class="card-content">
                <div class="card-icon">🤓</div>
                <div class="card-text">
                    <h2>Grammar</h2>
                    <p>videocourse practice</p>
                </div>
            </div>
            <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
        </a>
        
    </main>

    <footer>
        <a href="https://instagram.com/doctors.speak" target="_blank" class="instagram-link">
            <span>Получить пароль в директ</span>
        </a>
    </footer>

</body>
</html>
