<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kazdoctors — dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 30px 20px;
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        #userEmail {
            color: #666;
            margin-bottom: 30px;
        }

        .trainer {
            display: block;
            padding: 20px;
            margin: 15px 0;
            border: 1px solid #ddd;
            border-radius: 12px;
            text-decoration: none;
            color: #222;
        }

        .trainer:hover {
            background: #f5f5f5;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <h1>Welcome to kazdoctors!</h1>

    <div id="userEmail"></div>

    <h2>Your trainers</h2>

    <a class="trainer" href="/clinical/">
        🩺 Clinical Vocabulary
    </a>

    <a class="trainer" href="/anatomical/">
        🦴 Anatomical Vocabulary
    </a>

    <a class="trainer" href="/neurology/">
        🧠 Neurology
    </a>

    <br>

    <button onclick="logout()">Log out</button>


<script>

const SUPABASE_URL = "https://jjfkiqmqoscnodcvdktf.supabase.co";
const SUPABASE_KEY = "sb_publishable_2Ygo9OvIMmtCfqt1C0glow_uDGaQ7nZ";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// Проверяем, вошёл ли пользователь
async function checkUser() {

    const { data, error } = await supabaseClient.auth.getSession();

    if (error) {
        console.error(error);
        window.location.href = "/login.html";
        return;
    }

    // Пользователь НЕ авторизован
    if (!data.session) {
        window.location.href = "/login.html";
        return;
    }

    // Пользователь авторизован
    const user = data.session.user;

    document.getElementById("userEmail").textContent =
        user.email;
}


// Выход
async function logout() {

    await supabaseClient.auth.signOut();

    window.location.href = "/login.html";
}


checkUser();

</script>

</body>
</html>
