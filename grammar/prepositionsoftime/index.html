    // Helper to shuffle array (Fisher-Yates)
    function shuffleArray(array) {
      let arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;

    let total = 0;
    let correct = 0;
    let streak = 0;
    let currentQuestion = null;
    let answered = false;

    function changeLevel() {
      nextQuestion();
    }

    function getFilteredQuestions() {
      const selectedLevel = document.getElementById('levelSelect').value;
      if (selectedLevel === 'mix') {
        return questions;
      }
      return questions.filter(q => q.level === parseInt(selectedLevel));
    }

    function nextQuestion() {
      answered = false;
      
      const nextBtn = document.getElementById('nextBtn');
      nextBtn.classList.remove('visible');

      const expBox = document.getElementById('explanationBox');
      expBox.classList.remove('answered');
      document.getElementById('explanationText').textContent = "Choose the correct answer!";

      const pool = getFilteredQuestions();
      currentQuestion = pool[Math.floor(Math.random() * pool.length)];

      const levelTag = document.getElementById('levelTag');
      levelTag.textContent = `Level ${currentQuestion.level}`;

      document.getElementById('questionText').textContent = currentQuestion.question;

      // Handle Level 3 chunks shuffling dynamically
      const chunksBox = document.getElementById('chunksBox');
      if (currentQuestion.level === 3 && currentQuestion.rawChunks) {
        const shuffled = shuffleArray(currentQuestion.rawChunks);
        chunksBox.textContent = shuffled.join(" / ");
        chunksBox.classList.remove('invisible');
      } else {
        chunksBox.textContent = '';
        chunksBox.classList.add('invisible');
      }

      // Render answer options
      const grid = document.getElementById('optionsGrid');
      grid.innerHTML = '';

      currentQuestion.options.forEach((optText, index) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = `${String.fromCharCode(65 + index)}) ${optText}`;
        btn.onclick = () => selectOption(btn, index);
        grid.appendChild(btn);
      });
    }

    function selectOption(selectedBtn, selectedIndex) {
      if (answered) return;
      answered = true;

      total++;
      const isCorrect = (selectedIndex === currentQuestion.correct);

      if (isCorrect) {
        correct++;
        streak++;
        selectedBtn.classList.add('correct');
      } else {
        streak = 0;
        selectedBtn.classList.add('wrong');
        
        const allBtns = document.querySelectorAll('.option-btn');
        if (allBtns[currentQuestion.correct]) {
          allBtns[currentQuestion.correct].classList.add('correct');
        }
      }

      document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);

      document.getElementById('totalCount').textContent = total;
      document.getElementById('correctCount').textContent = correct;
      document.getElementById('streakCount').textContent = `${streak} 🔥`;

      const expBox = document.getElementById('explanationBox');
      expBox.classList.add('answered');
      document.getElementById('explanationText').textContent = currentQuestion.explanation;

      document.getElementById('nextBtn').classList.add('visible');
    }
