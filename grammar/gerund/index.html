  <style>
    :root {

    * {

    body {
      background: var(--bg-main);
      color: var(--text-dark);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px 10px;

    .card {
      background: var(--card-bg);
      border-radius: 20px;
      width: 100%;
      max-width: 440px;
      min-height: 720px;
      height: 720px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);

      position: relative;
      overflow: hidden;

      background: var(--kz-blue);
      color: #FFFFFF;
      padding: 16px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 14px rgba(0, 161, 222, 0.2);
      flex-shrink: 0;
    }

    .home-btn {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #FFFFFF;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.78rem;
      padding: 6px 14px;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }

    .home-btn:active {
      transform: scale(0.96);
      background: rgba(255, 255, 255, 0.3);
    }

      font-weight: 800;
      font-size: 0.82rem;
      letter-spacing: 0.5px;
      color: #FFFFFF;
      background: rgba(255, 255, 255, 0.18);
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.35);

      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
      padding: 16px;
      gap: 8px;
      overflow-y: hidden;

      color: #15803D !important;

      color: #B91C1C !important;

      line-height: 1.3;

</head>

    let total = 0;
    let correct = 0;
    let streak = 0;
    let currentQuestion = null;
    let answered = false;

    function changeLevel() {
      nextQuestion();
    }

    function getFilteredQuestions() {
      const selectedLevel = document.getElementById('levelSelect').value;
      if (selectedLevel === 'mix') {
        return rawQuestionBank;
      }
      return rawQuestionBank.filter(q => q.level === parseInt(selectedLevel));
    }

    function nextQuestion() {
      answered = false;
      
      const nextBtn = document.getElementById('nextBtn');
      nextBtn.classList.remove('visible');

      const expBox = document.getElementById('explanationBox');
      expBox.classList.remove('answered');
      document.getElementById('explanationText').textContent = "Choose the correct answer!";

      const pool = getFilteredQuestions();
      const rawQ = pool[Math.floor(Math.random() * pool.length)];

      const levelTag = document.getElementById('levelTag');
      levelTag.textContent = `Level ${rawQ.level}`;

      document.getElementById('questionText').textContent = rawQ.question;

      const chunksBox = document.getElementById('chunksBox');
      if (rawQ.level === 3 && rawQ.rawChunks) {
        const shuffledChunks = shuffleArray(rawQ.rawChunks);
        chunksBox.textContent = shuffledChunks.join(" / ");
        chunksBox.classList.remove('invisible');
      } else {
        chunksBox.textContent = '';
        chunksBox.classList.add('invisible');
      }

      currentQuestion = {
        level: rawQ.level,
        question: rawQ.question,
        explanation: rawQ.explanation,
        computedCorrectIndex: rawQ.targetIndex,
        displayOptions: rawQ.options
      };

      const grid = document.getElementById('optionsGrid');
      grid.innerHTML = '';

      currentQuestion.displayOptions.forEach((optText, index) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = `${String.fromCharCode(65 + index)}) ${optText}`;
        btn.onclick = () => selectOption(btn, index);
        grid.appendChild(btn);
      });
    }

    function selectOption(selectedBtn, selectedIndex) {
      if (answered) return;
      answered = true;

      total++;
      const isCorrect = (selectedIndex === currentQuestion.computedCorrectIndex);

      if (isCorrect) {
        correct++;
        streak++;
        selectedBtn.classList.add('correct');
      } else {
        streak = 0;
        selectedBtn.classList.add('wrong');
        
        const allBtns = document.querySelectorAll('.option-btn');
        if (allBtns[currentQuestion.computedCorrectIndex]) {
          allBtns[currentQuestion.computedCorrectIndex].classList.add('correct');
        }
      }

      document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);

      document.getElementById('totalCount').textContent = total;
      document.getElementById('correctCount').textContent = correct;
      document.getElementById('streakCount').textContent = `${streak} 🔥`;

      const expBox = document.getElementById('explanationBox');
      expBox.classList.add('answered');
      document.getElementById('explanationText').textContent = currentQuestion.explanation;

      document.getElementById('nextBtn').classList.add('visible');
    }
