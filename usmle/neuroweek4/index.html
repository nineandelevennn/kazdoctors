        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Dynamically populate the Day Dropdown based on QUIZ_DATA
        function initDayDropdown() {
            const dayMap = new Map();
            QUIZ_DATA.forEach(item => {
                if (!dayMap.has(item.day)) {
                    dayMap.set(item.day, item.dayTitle);
                }
            });

            daySelect.innerHTML = '';
            
            // Collect unique sorted day keys
            const sortedDays = Array.from(dayMap.keys()).sort((a, b) => a - b);
            
            sortedDays.forEach(day => {
                const option = document.createElement('option');
                option.value = day;
                option.textContent = `Day ${day}: ${dayMap.get(day)}`;
                daySelect.appendChild(option);
            });

            const allOption = document.createElement('option');
            allOption.value = 'all';
            allOption.textContent = 'All Days (Master Review)';
            allOption.selected = true;
            daySelect.appendChild(allOption);
        }

        function filterCards() {
            if (state.currentDay === 'all') {
                state.activeCards = shuffleArray(QUIZ_DATA);
            } else {
                const dayNum = parseInt(state.currentDay, 10);
                const filtered = QUIZ_DATA.filter(card => card.day === dayNum);
                state.activeCards = shuffleArray(filtered);
            }
            state.currentIndex = 0;
        }

        function generateOptions(currentCard) {
            if (currentCard.options && Array.isArray(currentCard.options) && currentCard.options.length >= 2) {
                return shuffleArray(currentCard.options);
            }

            const correctAnswer = currentCard.answer;
            const otherAnswers = Array.from(new Set(
                QUIZ_DATA.map(c => c.answer).filter(ans => ans !== correctAnswer)
            ));

            const wrongChoices = shuffleArray(otherAnswers).slice(0, 3);
            return shuffleArray([correctAnswer, ...wrongChoices]);
        }

        function resetExplanationBox() {
            feedbackTitle.className = 'flex items-center gap-1.5 font-bold mb-0.5 text-slate-400';
            feedbackTitle.innerHTML = `
                <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span>Explanation</span>
            `;
            explanationText.className = 'leading-snug text-[11px] text-slate-400 italic';
            explanationText.textContent = 'Select an answer above to view the high-yield explanation...';
            
            nextBtn.disabled = true;
            nextBtn.className = 'w-full h-full bg-slate-200 text-slate-400 font-bold text-xs sm:text-sm rounded-xl transition-all flex items-center justify-center gap-2 cursor-not-allowed opacity-60';
        }

        function renderCard() {
            if (state.activeCards.length === 0) return;

            state.isAnswered = false;
            state.userSelectedOption = null;

            resetExplanationBox();

            const currentCard = state.activeCards[state.currentIndex];
            
            cardCategoryBadge.textContent = `Day ${currentCard.day}: ${currentCard.dayTitle}`;
            cardProgressText.textContent = `Card ${state.currentIndex + 1} of ${state.activeCards.length}`;

            questionPrompt.textContent = currentCard.prompt;

            const options = generateOptions(currentCard);
            optionsContainer.innerHTML = '';

            options.forEach((optText, idx) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `w-full text-left p-2 rounded-xl border border-slate-300 bg-white hover:bg-slate-50 active:scale-[0.98] transition-all flex items-center gap-2 text-clamp-option text-slate-900 font-medium cursor-pointer shadow-sm min-h-[40px] overflow-hidden`;
                
                const letter = String.fromCharCode(65 + idx);
                btn.innerHTML = `
                    <span class="shrink-0 w-5 h-5 rounded-md bg-slide-light border border-sky-200 text-[10px] font-bold text-slide-red flex items-center justify-center">
                        ${letter}
                    </span>
                    <span class="flex-1 text-balance line-clamp-2 leading-tight">${optText}</span>
                `;

                btn.onclick = () => handleOptionSelect(optText, currentCard, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function handleOptionSelect(selectedOption, currentCard, clickedBtn) {
            if (state.isAnswered) return;
            state.isAnswered = true;

            const isCorrect = selectedOption === currentCard.answer;
            state.doneCount++;

            const optionButtons = optionsContainer.querySelectorAll('button');
            
            optionButtons.forEach(btn => {
                btn.disabled = true;
                btn.classList.remove('hover:bg-slate-50', 'active:scale-[0.98]', 'cursor-pointer');
                btn.classList.add('cursor-default');

                const textSpan = btn.querySelector('span:last-child');
                const optText = textSpan ? textSpan.textContent.trim() : '';

                if (optText === currentCard.answer) {
                    btn.classList.remove('bg-white', 'border-slate-300');
                    btn.classList.add('bg-emerald-50', 'border-emerald-500', 'text-emerald-950', 'ring-1', 'ring-emerald-500');
                    const badge = btn.querySelector('span:first-child');
                    if (badge) {
                        badge.classList.remove('bg-slide-light', 'border-sky-200', 'text-slide-red');
                        badge.classList.add('bg-emerald-600', 'border-emerald-600', 'text-white');
                    }
                }
            });

            if (isCorrect) {
                state.correctCount++;
                state.streakCount++;
                
                feedbackTitle.className = 'flex items-center gap-1.5 font-bold mb-0.5 text-emerald-700';
                feedbackTitle.innerHTML = `
                    <svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
                    <span>Correct! High-Yield Fact</span>
                `;
            } else {
                state.streakCount = 0;
                
                clickedBtn.classList.remove('bg-white', 'border-slate-300');
                clickedBtn.classList.add('bg-rose-50', 'border-rose-500', 'text-rose-950');
                const badge = clickedBtn.querySelector('span:first-child');
                if (badge) {
                    badge.classList.remove('bg-slide-light', 'border-sky-200', 'text-slide-red');
                    badge.classList.add('bg-rose-600', 'border-rose-600', 'text-white');
                }

                feedbackTitle.className = 'flex items-center gap-1.5 font-bold mb-0.5 text-rose-700';
                feedbackTitle.innerHTML = `
                    <svg class="w-4 h-4 text-rose-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg>
                    <span>Incorrect &bull; Key High-Yield Concept</span>
                `;
            }

            updateStatsDisplay();

            explanationText.className = 'leading-snug text-[11px] text-slate-700 not-italic';
            explanationText.textContent = currentCard.explanation;

            nextBtn.disabled = false;
            nextBtn.className = 'w-full h-full bg-slide-red hover:bg-slide-darkred text-white font-bold text-xs sm:text-sm rounded-xl shadow-md active:scale-[0.98] transition-all flex items-center justify-center gap-2 cursor-pointer';
        }

        function updateStatsDisplay() {
            statDone.textContent = state.doneCount;
            statCorrect.textContent = state.correctCount;
            
            const accuracy = state.doneCount > 0 
                ? Math.round((state.correctCount / state.doneCount) * 100) 
                : 0;
            statAccuracy.textContent = `(${accuracy}%)`;

            statStreak.textContent = state.streakCount;
        }

        function nextQuestion() {
            if (!state.isAnswered) return;
            state.currentIndex++;
            if (state.currentIndex >= state.activeCards.length) {
                state.activeCards = shuffleArray(state.activeCards);
                state.currentIndex = 0;
            }
            renderCard();
        }

        function resetStats() {
            state.doneCount = 0;
            state.correctCount = 0;
            state.streakCount = 0;
            updateStatsDisplay();
            filterCards();
            renderCard();
        }

        daySelect.addEventListener('change', (e) => {
            state.currentDay = e.target.value;
            filterCards();
            renderCard();
        });

        nextBtn.addEventListener('click', nextQuestion);
        resetStatsBtn.addEventListener('click', resetStats);

        // Keyboard shortcuts (1-4 or A-D to choose option, Space/Enter for Next)
        document.addEventListener('keydown', (e) => {
            if (!state.isAnswered) {
                const keyMap = { '1': 0, '2': 1, '3': 2, '4': 3, 'a': 0, 'b': 1, 'c': 2, 'd': 3 };
                const idx = keyMap[e.key.toLowerCase()];
                if (idx !== undefined) {
                    const buttons = optionsContainer.querySelectorAll('button');
                    if (buttons[idx]) buttons[idx].click();
                }
            } else {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    nextQuestion();
                }
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            initDayDropdown();
            filterCards();
            renderCard();
            updateStatsDisplay();
        });
    </script>
</body>
</html>
